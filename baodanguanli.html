<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>保单管理系统</title>
<style>
/* ======== CSS Variables - Financial Precision ======== */
:root {
  --color-bg: #f5f3ef;
  --color-surface: #ffffff;
  --color-primary: #1a2744;
  --color-primary-light: #243656;
  --color-accent: #1a2744;
  --color-accent-light: #243656;
  --color-accent-pale: #eef1f7;
  --color-success: #059669;
  --color-success-light: #10b981;
  --color-danger: #c41e3a;
  --color-danger-light: #dc2626;
  --color-text-primary: #0f172a;
  --color-text-secondary: #334155;
  --color-text-muted: #64748b;
  --color-border: #d1d5db;
  --color-border-light: #e5e7eb;
  --color-subtle: #f1f5f9;
  --color-subtle-warm: #f5f3ef;
  --color-shadow-sm: rgba(0,0,0,0.05);
  --color-shadow-md: rgba(0,0,0,0.08);
  --color-shadow-lg: rgba(0,0,0,0.15);
  --color-overlay: rgba(0,0,0,0.6);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --ease-out: cubic-bezier(0.33, 1, 0.68, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --font-heading: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-body: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
}

/* ======== 全局样式重置 ======== */
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; }
body {
  font-family: var(--font-body);
  background: var(--color-bg);
  color: var(--color-text-primary);
  min-height: 100vh;
  line-height: 1.6;
  overscroll-behavior: contain;
  letter-spacing: 0.01em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
button, input, select, textarea {
  font-family: var(--font-body);
  font-size: inherit;
}
button { cursor: pointer; }
input, select, textarea {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid var(--color-border);
  border-radius: var(--radius-md);
  font-size: 14px;
  transition: all 0.25s var(--ease-out);
  background: var(--color-surface);
  color: var(--color-text-primary);
}
input:hover, select:hover, textarea:hover { border-color: var(--color-text-muted); }
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px rgba(26,39,68,0.12), 0 1px 4px rgba(0,0,0,0.06);
  background: var(--color-surface);
}
button {
  padding: 10px 20px;
  border: none;
  border-radius: var(--radius-md);
  font-size: 14px;
  font-weight: 600;
  transition: all 0.25s var(--ease-out);
  min-height: 44px;
  min-width: 44px;
  letter-spacing: 0.02em;
}
.btn-primary { background: var(--color-primary); color: #fff; box-shadow: 0 2px 8px rgba(26,39,68,0.25); }
.btn-primary:hover { background: var(--color-primary-light); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(26,39,68,0.35); }
.btn-primary:active { transform: translateY(0); }
.btn-success { background: var(--color-success); color: #fff; box-shadow: 0 2px 8px rgba(5,150,105,0.25); }
.btn-success:hover { background: var(--color-success-light); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(5,150,105,0.35); }
.btn-success:active { transform: translateY(0); }
.btn-danger { background: var(--color-danger); color: #fff; box-shadow: 0 2px 8px rgba(196,30,58,0.25); }
.btn-danger:hover { background: var(--color-danger-light); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(196,30,58,0.35); }
.btn-danger:active { transform: translateY(0); }
.btn-warning { background: #b45309; color: #fff; box-shadow: 0 2px 8px rgba(180,83,9,0.25); }
.btn-warning:hover { background: #d97706; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(180,83,9,0.35); }
.btn-warning:active { transform: translateY(0); }
.btn-secondary { background: var(--color-text-secondary); color: #fff; box-shadow: 0 2px 8px rgba(51,65,85,0.25); }
.btn-secondary:hover { background: #475569; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(51,65,85,0.35); }
.btn-secondary:active { transform: translateY(0); }
.btn-outline {
  background: transparent;
  border: 1.5px solid var(--color-primary);
  color: var(--color-primary);
  box-shadow: none;
}
.btn-outline:hover { background: var(--color-primary); color: #fff; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(26,39,68,0.3); }
.btn-outline:active { transform: translateY(0); }
.btn-sm { padding: 6px 14px; font-size: 12px; min-height: 36px; border-radius: var(--radius-sm); }
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

/* ======== 卡片通用样式 ======== */
.card {
  background: var(--color-surface);
  border-radius: var(--radius-lg);
  box-shadow: 0 1px 3px var(--color-shadow-sm), 0 4px 16px var(--color-shadow-sm);
  padding: 22px;
  margin-bottom: 16px;
  border: 1px solid var(--color-border);
  transition: all 0.35s var(--ease-out);
}
.card:hover { box-shadow: 0 2px 6px var(--color-shadow-sm), 0 8px 24px var(--color-shadow-md); border-color: var(--color-text-muted); }
.card-title {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--color-text-primary);
  padding-bottom: 10px;
  border-bottom: 2px solid var(--color-primary);
  letter-spacing: 0.03em;
}

/* ======== 状态标签 ======== */
.tag {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.03em;
  line-height: 1.4;
}
.tag-green { background: #ecfdf5; color: #065f46; }
.tag-red { background: #fef2f2; color: #991b1b; }
.tag-yellow { background: #fffbeb; color: #92400e; }
.tag-blue { background: #eff6ff; color: #1e40af; }
.tag-purple { background: #f5f3ff; color: #5b21b6; }
.tag-gray { background: var(--color-subtle); color: var(--color-text-secondary); }

/* ======== 登录/注册页 ======== */
#authPage {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  background: linear-gradient(160deg, #0f1a2e 0%, #1a2744 30%, #1e3560 50%, #1a2744 70%, #0f1a2e 100%);
  padding: 20px;
  position: relative;
  overflow: hidden;
}
#authPage::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  opacity: 0.5;
  pointer-events: none;
}
.auth-container {
  background: var(--color-surface);
  border-radius: var(--radius-xl);
  box-shadow: 0 24px 64px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.08);
  width: 100%;
  max-width: 420px;
  padding: 44px 34px;
  position: relative;
  z-index: 1;
  animation: authFadeIn 0.5s var(--ease-out);
}
@keyframes authFadeIn {
  from { opacity: 0; transform: translateY(20px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.auth-header {
  text-align: center;
  margin-bottom: 32px;
}
.auth-header h1 {
  font-family: var(--font-heading);
  font-size: 28px;
  font-weight: 700;
  color: var(--color-text-primary);
  margin-bottom: 6px;
  letter-spacing: 0.04em;
}
.auth-header .logo {
  font-size: 52px;
  display: block;
  margin-bottom: 10px;
}
.auth-tabs {
  display: flex;
  background: var(--color-subtle);
  border-radius: var(--radius-md);
  padding: 4px;
  margin-bottom: 24px;
  gap: 4px;
}
.auth-tab {
  flex: 1;
  padding: 10px;
  text-align: center;
  font-weight: 600;
  font-size: 14px;
  color: var(--color-text-secondary);
  cursor: pointer;
  border-radius: 10px;
  background: none;
  border: none;
  transition: all 0.3s var(--ease-out);
}
.auth-tab.active {
  color: var(--color-text-primary);
  background: var(--color-surface);
  box-shadow: 0 1px 3px var(--color-shadow-sm);
}
.auth-form .form-group {
  margin-bottom: 16px;
}
.auth-form label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--color-text-secondary);
  letter-spacing: 0.02em;
}
.auth-form .btn-primary {
  width: 100%;
  padding: 13px;
  font-size: 15px;
  margin-top: 8px;
  border-radius: var(--radius-md);
  font-weight: 700;
  background: var(--color-primary);
  letter-spacing: 0.06em;
}
.auth-error {
  color: var(--color-danger);
  font-size: 13px;
  text-align: center;
  margin-top: 10px;
  min-height: 20px;
  font-weight: 500;
}

/* ======== 主界面布局 ======== */
#mainApp { display: none; min-height: 100vh; background: var(--color-bg); }
.top-bar {
  background: linear-gradient(135deg, #0f1a2e 0%, #1a2744 50%, #0f1a2e 100%);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 16px rgba(0,0,0,0.25);
}
.top-bar h1 {
  font-family: var(--font-heading);
  font-size: 20px;
  font-weight: 700;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 8px;
  letter-spacing: 0.05em;
}
.top-bar .user-info {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  color: #cbd5e1;
  font-weight: 500;
}
.top-bar .user-info span { color: #fff; font-weight: 600; }
.top-bar .btn-secondary {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  color: #fff;
  padding: 6px 14px;
  font-size: 12px;
  box-shadow: none;
}
.top-bar .btn-secondary:hover {
  background: rgba(255,255,255,0.16);
  border-color: rgba(255,255,255,0.25);
  transform: none;
}

/* 导航栏 */
.nav-bar {
  background: var(--color-surface);
  border-bottom: 2px solid var(--color-border);
  padding: 0 24px;
  display: flex;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  box-shadow: 0 1px 4px var(--color-shadow-sm);
}
.nav-item {
  padding: 15px 22px;
  font-size: 13px;
  font-weight: 600;
  color: var(--color-text-secondary);
  cursor: pointer;
  white-space: nowrap;
  position: relative;
  background: none;
  border: none;
  transition: all 0.3s var(--ease-out);
  letter-spacing: 0.03em;
}
.nav-item::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%) scaleX(0);
  width: 60%;
  height: 3px;
  background: var(--color-primary);
  border-radius: 3px 3px 0 0;
  transition: transform 0.35s var(--ease-spring);
}
.nav-item.active {
  color: var(--color-primary);
  font-weight: 800;
}
.nav-item.active::after { transform: translateX(-50%) scaleX(1); }
.nav-item:hover { color: var(--color-primary); }

/* 内容区域 */
.content { padding: 20px; max-width: 1400px; margin: 0 auto; }

/* 底部状态栏 */
.bottom-bar {
  background: var(--color-surface);
  border-top: 1px solid var(--color-border);
  padding: 10px 24px;
  font-size: 12px;
  color: var(--color-text-muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  bottom: 0;
  z-index: 100;
  font-weight: 500;
}
.sync-status { display: flex; align-items: center; gap: 6px; }
.sync-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--color-success);
  box-shadow: 0 0 6px rgba(5,150,105,0.4);
}
.sync-dot.offline { background: var(--color-danger); box-shadow: 0 0 6px rgba(196,30,58,0.4); }
.sync-dot.syncing { background: #b45309; animation: pulse 1s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.7); }
}

/* ======== 首页 - 仪表盘 ======== */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}
.stat-card {
  background: var(--color-surface);
  border-radius: var(--radius-lg);
  padding: 22px;
  box-shadow: 0 1px 3px var(--color-shadow-sm), 0 4px 16px var(--color-shadow-sm);
  text-align: center;
  border: 1px solid var(--color-border);
  transition: all 0.35s var(--ease-out);
  position: relative;
  overflow: hidden;
}
.stat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: var(--color-primary);
  border-radius: 3px 3px 0 0;
}
.stat-card:hover { transform: translateY(-2px); box-shadow: 0 4px 8px var(--color-shadow-sm), 0 12px 28px var(--color-shadow-md); }
.stat-card .stat-value {
  font-family: var(--font-heading);
  font-size: 34px;
  font-weight: 800;
  color: var(--color-text-primary);
  letter-spacing: -0.01em;
}
.stat-card .stat-label {
  font-size: 12px;
  color: var(--color-text-secondary);
  margin-top: 4px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.stat-card.green::before { background: var(--color-success); }
.stat-card.green .stat-value { color: #059669; }
.stat-card.red::before { background: var(--color-danger); }
.stat-card.red .stat-value { color: #c41e3a; }
.stat-card.yellow::before { background: #b45309; }
.stat-card.yellow .stat-value { color: #b45309; }

/* ======== 双栏布局（电脑端） ======== */
@media (min-width: 768px) {
  .two-col-layout {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 20px;
    align-items: start;
  }
}

/* ======== 搜索相关 ======== */
.search-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.search-bar input { flex: 1; min-width: 200px; }
.search-bar button { white-space: nowrap; }
.search-result-info {
  font-size: 13px;
  color: var(--color-text-secondary);
  margin-bottom: 12px;
  font-weight: 500;
}
.client-item {
  padding: 16px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  margin-bottom: 10px;
  cursor: pointer;
  transition: all 0.25s var(--ease-out);
  background: var(--color-surface);
  position: relative;
}
.client-item::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  background: transparent;
  border-radius: 3px 0 0 3px;
  transition: background 0.25s var(--ease-out);
}
.client-item:hover { border-color: var(--color-primary); background: var(--color-accent-pale); transform: translateX(2px); box-shadow: 0 2px 10px var(--color-shadow-sm); }
.client-item:hover::before { background: var(--color-primary); }
.client-item.active { border-color: var(--color-primary); background: var(--color-accent-pale); box-shadow: 0 0 0 2px rgba(26,39,68,0.12); }
.client-item.active::before { background: var(--color-primary); }
.client-item .client-name {
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 4px;
  color: #0f172a;
}
.client-item .client-meta {
  font-size: 12px;
  color: var(--color-text-secondary);
  font-weight: 500;
}

/* CRM卡片样式 */
.crm-client-card:hover {
  border-color: #1a2744 !important;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08) !important;
  transform: translateY(-2px);
}
.crm-client-card.active {
  border-color: #1a2744 !important;
  box-shadow: 0 0 0 2px rgba(26,39,68,0.15) !important;
  background: #eef1f7 !important;
}

/* ======== 高级搜索面板 ======== */
.advanced-search {
  display: none;
  background: var(--color-subtle);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: 18px;
  margin-bottom: 16px;
}
.advanced-search.show { display: block; animation: slideDown 0.3s var(--ease-out); }
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}
.advanced-search-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
}

/* ======== 客户详情 ======== */
.detail-panel { display: none; }
.detail-panel.show { display: block; animation: fadeIn 0.3s var(--ease-out); }
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
.detail-section { margin-bottom: 20px; }
.detail-section h3 {
  font-family: var(--font-heading);
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--color-primary);
  color: var(--color-text-primary);
  letter-spacing: 0.04em;
}

/* 客户姓名高亮卡片 */
.client-name-hero {
  background: linear-gradient(135deg, #0f1a2e, #1a2744);
  padding: 20px 24px;
  border-radius: 12px;
  margin-bottom: 16px;
  box-shadow: 0 4px 20px rgba(26,39,68,0.3);
}
.client-name-hero h3 {
  font-size: 32px;
  font-weight: 900;
  color: #ffffff;
  margin: 0;
  letter-spacing: 0.05em;
}
.client-name-hero .client-meta-info {
  font-size: 14px;
  color: rgba(255,255,255,0.85);
  margin-top: 4px;
  font-weight: 500;
}

/* 保单详情卡 */
.policy-detail-card {
  background: #ffffff;
  border: 1.5px solid #cbd5e1;
  border-radius: 10px;
  margin-bottom: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.06);
}
.policy-detail-header {
  background: #1a2744;
  padding: 14px 18px;
  border-bottom: 1px solid #0f1a2e;
  border-radius: 10px 10px 0 0;
}
.policy-detail-header h5 {
  font-size: 16px;
  font-weight: 800;
  color: #ffffff;
  margin: 0;
}
.policy-detail-header .policy-meta {
  font-size: 13px;
  color: rgba(255,255,255,0.75);
  margin-top: 4px;
  font-weight: 500;
}
.policy-detail-header .btn-sm {
  color: #ffffff !important;
  border-color: rgba(255,255,255,0.5) !important;
  background: rgba(255,255,255,0.1) !important;
}
.policy-detail-header .btn-sm:hover {
  background: rgba(255,255,255,0.25) !important;
  border-color: rgba(255,255,255,0.8) !important;
}
.policy-detail-header .btn-sm.btn-danger {
  background: rgba(220,38,38,0.3) !important;
  border-color: rgba(220,38,38,0.5) !important;
}
.policy-detail-body {
  padding: 16px 18px;
}
.policy-detail-body .info-block {
  background: #f8fafc;
  border: 1.5px solid #d1d5db;
  border-radius: 8px;
  padding: 14px;
  margin-bottom: 10px;
}
.policy-detail-body .info-block h6 {
  font-size: 14px;
  color: #0f172a;
  margin-bottom: 8px;
  padding-bottom: 6px;
  border-bottom: 2px solid #cbd5e1;
  font-weight: 800;
}
.policy-detail-body .info-block.insured-block {
  background: #eef1f7;
  border-color: #bcc6d8;
}
.policy-detail-body .info-block.insured-block h6 {
  color: #1a2744;
  border-bottom-color: #1a2744;
}
.policy-detail-body .info-block.amount-block {
  background: #f8fafc;
  border-color: #cbd5e1;
}
.policy-detail-body .info-block.amount-block h6 {
  color: #0f172a;
  border-bottom-color: #94a3b8;
}
.policy-detail-body .amount-item {
  text-align: center;
  padding: 10px;
  background: #ffffff;
  border-radius: 8px;

/* ======== 返回按钮 ======== */

/* ======== 模态框 ======== */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--color-overlay);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.show { display: flex; animation: modalFadeIn 0.25s var(--ease-out); }
@keyframes modalFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
.modal {
  background: var(--color-surface);
  border-radius: var(--radius-xl);
  width: 100%;
  max-width: 620px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 32px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.3);
  animation: modalSlideUp 0.35s var(--ease-spring);
  border: 1px solid var(--color-border);
}
@keyframes modalSlideUp {
  from { transform: translateY(30px) scale(0.96); opacity: 0; }
  to { transform: translateY(0) scale(1); opacity: 1; }
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 2px solid var(--color-primary);
  position: relative;
}
.modal-header::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 0;
  width: 48px;
  height: 3px;
  background: var(--color-primary);
  border-radius: 1px;
}
.modal-header h2 {
  font-family: var(--font-heading);
  font-size: 22px;
  font-weight: 800;
  color: var(--color-text-primary);
  letter-spacing: 0.04em;
}
.modal-close {
  background: var(--color-subtle);
  border: none;
  font-size: 20px;
  color: var(--color-text-secondary);
  min-width: 38px;
  min-height: 38px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s var(--ease-out);
  font-weight: 500;
}
.modal-close:hover { background: var(--color-border); color: var(--color-text-primary); }
.modal-body .form-group { margin-bottom: 16px; }
.modal-body label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 5px;
  color: var(--color-text-primary);
  letter-spacing: 0.02em;
}
.modal-footer {
  margin-top: 28px;
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  padding-top: 18px;
  border-top: 1.5px solid var(--color-border);
}

/* ======== 提醒模块 ======== */
.reminder-list { list-style: none; }
.reminder-item {
  padding: 16px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  margin-bottom: 10px;
  display: flex;
  align-items: flex-start;

.reminder-item:hover { box-shadow: 0 4px 16px var(--color-shadow-md); transform: translateY(-1px); }
.reminder-item.overdue { border-left: 4px solid var(--color-danger); background: #fef2f2; }
.reminder-item.urgent { border-left: 4px solid #b45309; background: #fffbeb; }
.reminder-item.normal { border-left: 4px solid var(--color-primary); }
.reminder-item.dismissed { opacity: 0.45; }
.reminder-info h4 { font-size: 14px; margin-bottom: 4px; font-weight: 700; color: var(--color-text-primary); }
.reminder-info p { font-size: 12px; color: var(--color-text-secondary); font-weight: 500; }
.reminder-actions { display: flex; gap: 6px; flex-shrink: 0; }

/* ======== 追踪模块 ======== */
.timeline { position: relative; padding-left: 32px; }
.timeline::before {
  content: '';
  position: absolute;
  left: 10px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: linear-gradient(to bottom, var(--color-primary), var(--color-primary-light), var(--color-border));
  border-radius: 1px;
}
.timeline-item {
  position: relative;
  padding: 14px 0;
}
.timeline-item::before {
  content: '';
  position: absolute;
  left: -26px;
  top: 20px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--color-primary);
  border: 2px solid var(--color-surface);
  box-shadow: 0 0 0 2px var(--color-primary);
}
.timeline-item.success::before { background: var(--color-success); box-shadow: 0 0 0 2px var(--color-success); }
.timeline-item.warning::before { background: #b45309; box-shadow: 0 0 0 2px #b45309; }
.timeline-item.danger::before { background: var(--color-danger); box-shadow: 0 0 0 2px var(--color-danger); }
.timeline-date { font-size: 11px; color: var(--color-text-muted); margin-bottom: 4px; font-weight: 600; letter-spacing: 0.03em; }
.timeline-content { font-size: 14px; color: var(--color-text-primary); }

/* ======== 设置页面 ======== */
.setting-group {

  border-radius: var(--radius-md);
  margin-bottom: 12px;
  background: var(--color-surface);
}

  font-size: 15px;
  margin-bottom: 12px;
  color: var(--color-text-primary);
  font-weight: 800;
}

/* ======== 空状态 ======== */
.empty-state {

  color: var(--color-text-muted);
}

  font-size: 52px;
  margin-bottom: 12px;
  opacity: 0.5;
}

  font-size: 14px;
  margin-bottom: 16px;
  font-weight: 500;
}

.pwa-update-banner {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 10001;

  font-size: 14px;

.pwa-guide-modal {

  right: 20px;

  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toast {

/* ======== 隐藏/显示 ======== */
.hidden { display: none !important; }

      <button class="btn-secondary" onclick="closeModal('serviceModal')">取消</button>
      <button class="btn-primary" onclick="saveServiceRecord()">保存</button>
    </div>
  </div>
</div>

<!-- 确认对话框 -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal" style="max-width:400px;">
    <div class="modal-header">
      <h2>确认操作</h2>
      <button class="modal-close" onclick="closeModal('confirmModal')">&times;</button>
    </div>
    <div class="modal-body">
      <p id="confirmMessage">确定要执行此操作吗？</p>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('confirmModal')">取消</button>
      <button class="btn-danger" id="confirmBtn" onclick="">确认</button>
    </div>
  </div>
</div>

<script>
/* ========================================================================
   保单管理系统 - 完整JavaScript逻辑
   ======================================================================== */

/* ======== 全局状态 ======== */
let currentUser = null;         // 当前登录用户名
let clientData = [];            // 当前用户的保单数据
let reminderData = [];          // 当前用户的提醒数据
let currentTab = 'home';        // 当前Tab页
let selectedClientIdx = -1;     // 当前选中客户索引（查询页）
let reminderFilter = 'all';     // 提醒筛选条件
let currentTrackClient = '';     // 追踪页选中的客户名
let confirmCallback = null;     // 确认对话框回调

/* ======== 工具函数 ======== */

/* 简单hash（用于密码存储） */
function simpleHash(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    const char = str.charCodeAt(i);
    hash = ((hash << 5) - hash) + char;
    hash |= 0;
  }
  return 'H' + Math.abs(hash).toString(36);
}

/* 生成唯一ID */
function genId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
}

/* 日期格式化 */
function formatDate(dateStr) {
  if (!dateStr) return '';
  if (dateStr.length === 8 && /^\d{8}$/.test(dateStr)) {
    return dateStr.substr(0, 4) + '-' + dateStr.substr(4, 2) + '-' + dateStr.substr(6, 2);
  }
  return dateStr;
}

/* 日期转YYYYMMDD */
function toYMD(dateStr) {
  if (!dateStr) return '';
  return dateStr.replace(/-/g, '');
}

/* 格式化金额 */
function formatMoney(val) {
  if (!val && val !== 0) return '0';
  return parseFloat(val).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

/* Toast提示 */
function showToast(msg, type) {
  type = type || 'info';
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(function() { toast.remove(); }, 3000);
}

/* 打开/关闭模态框 */
function openModal(id) {
  document.getElementById(id).classList.add('show');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}

/* 显示确认框 */
function showConfirm(msg, callback) {
  document.getElementById('confirmMessage').textContent = msg;
  confirmCallback = callback;
  document.getElementById('confirmBtn').onclick = function() {
    closeModal('confirmModal');
    if (confirmCallback) confirmCallback();
  };
  openModal('confirmModal');
}

/* ======== 用户系统 ======== */

/* 获取所有用户列表 */
function getUsers() {
  try {
    return JSON.parse(localStorage.getItem('pms_users') || '[]');
  } catch(e) { return []; }
}

/* 保存用户列表 */
function saveUsers(users) {
  localStorage.setItem('pms_users', JSON.stringify(users));
}

/* 切换登录/注册Tab */
function switchAuthTab(tab) {
  const tabs = document.querySelectorAll('.auth-tab');
  tabs.forEach(function(t) { t.classList.remove('active'); });
  if (tab === 'login') {
    tabs[0].classList.add('active');
    document.getElementById('loginForm').classList.remove('hidden');
    document.getElementById('registerForm').classList.add('hidden');
  } else {
    tabs[1].classList.add('active');
    document.getElementById('loginForm').classList.add('hidden');
    document.getElementById('registerForm').classList.remove('hidden');
  }
}

/* 处理登录 */
function handleLogin(e) {
  e.preventDefault();
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');

  if (!username || !password) {
    errEl.textContent = '请填写用户名和密码';
    return;
  }

  const users = getUsers();
  const user = users.find(function(u) { return u.username === username; });
  if (!user) {
    errEl.textContent = '用户不存在';
    return;
  }
  if (user.passwordHash !== simpleHash(password)) {
    errEl.textContent = '密码错误';
    return;
  }

  /* 登录成功，更新最后登录时间 */
  user.lastLogin = new Date().toISOString();
  saveUsers(users);
  currentUser = username;
  localStorage.setItem('pms_currentUser', username);
  errEl.textContent = '';

  enterMainApp();
}

/* 处理注册 */
function handleRegister(e) {
  e.preventDefault();
  const username = document.getElementById('regUsername').value.trim();
  const password = document.getElementById('regPassword').value;
  const confirm = document.getElementById('regPasswordConfirm').value;
  const errEl = document.getElementById('regError');

  if (!username || !password || !confirm) {
    errEl.textContent = '请填写所有字段';
    return;
  }
  if (password.length < 6) {
    errEl.textContent = '密码长度至少6位';
    return;
  }
  if (password !== confirm) {
    errEl.textContent = '两次密码不一致';
    return;
  }

  const users = getUsers();
  if (users.find(function(u) { return u.username === username; })) {
    errEl.textContent = '用户名已存在';
    return;
  }

  users.push({
    username: username,
    passwordHash: simpleHash(password),
    createdAt: new Date().toISOString(),
    lastLogin: new Date().toISOString()
  });
  saveUsers(users);

  errEl.textContent = '';
  showToast('注册成功，请登录', 'success');
  switchAuthTab('login');
  document.getElementById('loginUsername').value = username;
}

/* 退出登录 */
function handleLogout() {
  currentUser = null;
  localStorage.removeItem('pms_currentUser');
  clientData = [];
  reminderData = [];
  document.getElementById('mainApp').style.display = 'none';
  document.getElementById('authPage').style.display = 'flex';
  document.getElementById('loginUsername').value = '';
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginError').textContent = '';
}

/* 进入主界面 */
function enterMainApp() {
  document.getElementById('authPage').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  document.getElementById('currentUserName').textContent = currentUser;
  loadUserData();
  loadCloudSettings();
  syncExistingPoliciesToLib();
  updateInsuranceTypeDatalist();
  switchTab('home');
  updateBottomStats();
}

/* ======== 数据存储（带用户前缀隔离） ======== */

/* 获取当前用户保单数据 */
function getPolicyData() {
  try {
    return JSON.parse(localStorage.getItem('policy_data_' + currentUser) || '[]');
  } catch(e) { return []; }
}

/* 保存保单数据 */
function savePolicyData() {
  localStorage.setItem('policy_data_' + currentUser, JSON.stringify(clientData));
  autoSyncPush();
}

/* 获取提醒数据 */
function getReminderData() {
  try {
    return JSON.parse(localStorage.getItem('reminders_' + currentUser) || '[]');
  } catch(e) { return []; }
}

/* 保存提醒数据 */
function saveReminderData() {
  localStorage.setItem('reminders_' + currentUser, JSON.stringify(reminderData));
  autoSyncPush();
}

/* 加载当前用户所有数据 */
function loadUserData() {
  clientData = getPolicyData();
  reminderData = getReminderData();
}

/* ======== 云同步（JSONBin.io） ======== */

/* 获取云同步设置 */
function getCloudConfig() {
  try {
    return JSON.parse(localStorage.getItem('cloud_config_' + currentUser) || '{}');
  } catch(e) { return {}; }
}

/* 加载云设置到界面 */
function loadCloudSettings() {
  const cfg = getCloudConfig();
  document.getElementById('settingApiKey').value = cfg.apiKey || '';
  document.getElementById('settingBinId').value = cfg.binId || '';
}

/* 保存云设置 */
function saveCloudSettings() {
  const apiKey = document.getElementById('settingApiKey').value.trim();
  const binId = document.getElementById('settingBinId').value.trim();
  localStorage.setItem('cloud_config_' + currentUser, JSON.stringify({ apiKey: apiKey, binId: binId }));
  showToast('云同步设置已保存', 'success');
  if (apiKey && !binId) {
    /* 自动创建新Bin */
    createNewBin();
  }
}

/* 创建新Bin */
function createNewBin() {
  const cfg = getCloudConfig();
  if (!cfg.apiKey) { showToast('请先设置API Key', 'warning'); return; }
  setSyncStatus('syncing');
  fetch('https://api.jsonbin.io/v3/b', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-Master-Key': cfg.apiKey
    },
    body: JSON.stringify(getAllUserData())
  })
  .then(function(r) {
    if (!r.ok) throw new Error('创建Bin失败');
    return r.json();
  })
  .then(function(data) {
    cfg.binId = data.metadata.id;
    cfg.lastSync = new Date().toISOString();
    localStorage.setItem('cloud_config_' + currentUser, JSON.stringify(cfg));
    document.getElementById('settingBinId').value = cfg.binId;
    showToast('Bin创建成功，ID: ' + cfg.binId, 'success');
    setSyncStatus('synced');
  })
  .catch(function(e) {
    showToast('创建Bin失败: ' + e.message, 'error');
    setSyncStatus('offline');
  });
}

/* 推送到云端 */
function pushToCloud() {
  const cfg = getCloudConfig();
  if (!cfg.apiKey || !cfg.binId) return Promise.resolve();
  setSyncStatus('syncing');
  return fetch('https://api.jsonbin.io/v3/b/' + cfg.binId, {
    method: 'PUT',
    headers: {
      'Content-Type': 'application/json',
      'X-Master-Key': cfg.apiKey
    },
    body: JSON.stringify(getAllUserData())
  })
  .then(function(r) {
    if (!r.ok) throw new Error('推送失败');
    cfg.lastSync = new Date().toISOString();
    localStorage.setItem('cloud_config_' + currentUser, JSON.stringify(cfg));
    setSyncStatus('synced');
  })
  .catch(function(e) {
    showToast('云同步失败: ' + e.message, 'error');
    setSyncStatus('offline');
  });
}

/* 手动推送 */
function manualPush() {
  showToast('正在推送到云端...', 'info');
  pushToCloud().then(function() {
    showToast('推送成功', 'success');
  });
}

/* 从云端拉取 */
function manualPull() {
  const cfg = getCloudConfig();
  if (!cfg.apiKey || !cfg.binId) {
    showToast('请先配置API Key和Bin ID', 'warning');
    return;
  }
  setSyncStatus('syncing');
  showToast('正在从云端拉取...', 'info');
  fetch('https://api.jsonbin.io/v3/b/' + cfg.binId + '/latest', {
    headers: { 'X-Master-Key': cfg.apiKey }
  })
  .then(function(r) {
    if (!r.ok) throw new Error('拉取失败');
    return r.json();
  })
  .then(function(data) {
    const cloudData = data.record;
    /* 检查时间戳 */
    const localLastModified = localStorage.getItem('policy_data_' + currentUser + '_timestamp') || '0';
    if (cloudData._timestamp && cloudData._timestamp > localLastModified) {
      /* 云端数据更新，覆盖本地 */
      if (cloudData.policies) {
        clientData = cloudData.policies;
        localStorage.setItem('policy_data_' + currentUser, JSON.stringify(clientData));
      }
      if (cloudData.reminders) {
        reminderData = cloudData.reminders;
        localStorage.setItem('reminders_' + currentUser, JSON.stringify(reminderData));
      }
      showToast('数据已从云端同步', 'success');
      refreshCurrentTab();
    } else {
      showToast('本地数据已是最新', 'info');
    }
    cfg.lastSync = new Date().toISOString();
    localStorage.setItem('cloud_config_' + currentUser, JSON.stringify(cfg));
    setSyncStatus('synced');
  })
  .catch(function(e) {
    showToast('拉取失败: ' + e.message, 'error');
    setSyncStatus('offline');
  });
}

/* 自动推送（数据变更时） */
function autoSyncPush() {
  const cfg = getCloudConfig();
  if (cfg.apiKey && cfg.binId) {
    localStorage.setItem('policy_data_' + currentUser + '_timestamp', Date.now().toString());
    pushToCloud();
  }
}

/* 获取所有用户数据（用于云端存储） */
function getAllUserData() {
  return {
    policies: clientData,
    reminders: reminderData,
    _timestamp: Date.now().toString(),
    _user: currentUser
  };
}

/* 设置同步状态 */
function setSyncStatus(status) {
  const dot = document.getElementById('syncDot');
  const text = document.getElementById('syncStatusText');
  dot.className = 'sync-dot';
  if (status === 'synced') {
    text.textContent = '已同步';
  } else if (status === 'syncing') {
    dot.classList.add('syncing');
    text.textContent = '同步中...';
  } else {
    dot.classList.add('offline');
    text.textContent = '未连接';
  }
}

/* ======== Tab切换 ======== */
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-item').forEach(function(n) {
    n.classList.toggle('active', n.dataset.tab === tab);
  });
  document.querySelectorAll('.tab-content').forEach(function(tc) {
    tc.classList.remove('active');
  });
  var el = document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1));
  if (el) el.classList.add('active');

  /* 切换到查询页时重置为列表视图 */
  if (tab === 'query') {
    var listView = document.getElementById('queryListView');
    var detailView = document.getElementById('clientDetailView');
    if (listView) listView.style.display = 'block';
    if (detailView) detailView.style.display = 'none';
    selectedClientIdx = -1;
  }

  refreshCurrentTab();
}

/* 刷新当前Tab内容 */
function refreshCurrentTab() {
  switch(currentTab) {
    case 'home': renderDashboard(); break;
    case 'query': handleSearch(); break;
    case 'reminders': renderReminders(); break;
    case 'tracking': populateTrackClientSelect(); break;
    case 'settings': renderInsuranceTypeLib(); break;
  }
  updateBottomStats();
}

/* 更新底部统计 */
function updateBottomStats() {
  var totalClients = clientData.length;
  var totalPolicies = 0;
  clientData.forEach(function(c) { totalPolicies += (c.policies || []).length; });
  document.getElementById('bottomStats').textContent =
    '客户: ' + totalClients + ' | 保单: ' + totalPolicies;
}

/* ======== 首页 - 仪表盘 ======== */
function renderDashboard() {
  var totalClients = clientData.length;
  var totalPolicies = 0;
  var validPolicies = 0;
  var expiredPolicies = 0;
  var totalPremium = 0;
  var totalSum = 0;
  var monthNew = 0;
  var now = new Date();
  var thisMonth = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');

  /* 险种统计 */
  var typeMap = {};
  clientData.forEach(function(c) {
    (c.policies || []).forEach(function(p) {
      totalPolicies++;
      if (p.status === '有效') validPolicies++;
      else expiredPolicies++;
      totalPremium += parseFloat(p.annualPremium) || 0;
      totalSum += parseFloat(p.sumInsured) || 0;
      /* 本月新增判断 */
      if (p.effectiveDate && p.effectiveDate.startsWith(thisMonth)) monthNew++;
      /* 险种统计 */
      var type = p.insuranceName || '未分类';
      typeMap[type] = (typeMap[type] || 0) + 1;
    });
  });

  var statsHtml = '' +
    '<div class="stat-card"><div class="stat-value">' + totalClients + '</div><div class="stat-label">总客户数</div></div>' +
    '<div class="stat-card"><div class="stat-value">' + totalPolicies + '</div><div class="stat-label">总保单数</div></div>' +
    '<div class="stat-card green"><div class="stat-value">' + validPolicies + '</div><div class="stat-label">有效保单</div></div>' +
    '<div class="stat-card red"><div class="stat-value">' + expiredPolicies + '</div><div class="stat-label">失效保单</div></div>' +
    '<div class="stat-card"><div class="stat-value">' + formatMoney(totalPremium) + '</div><div class="stat-label">总年缴保费（元）</div></div>' +
    '<div class="stat-card"><div class="stat-value">' + formatMoney(totalSum) + '</div><div class="stat-label">总保额（元）</div></div>' +
    '<div class="stat-card yellow"><div class="stat-value">' + monthNew + '</div><div class="stat-label">本月新增保单</div></div>';
  document.getElementById('dashboardStats').innerHTML = statsHtml;

  /* 生存金到期提醒（30天内） */
  var survivalAlerts = [];
  var today = new Date();
  today.setHours(0,0,0,0);
  clientData.forEach(function(c) {
    (c.policies || []).forEach(function(p) {
      if (p.survivalBenefit && p.survivalBenefit.type && p.survivalBenefit.nextDate) {
        var nd = p.survivalBenefit.nextDate;
        var nextDateObj = new Date(nd.substring(0,4) + '-' + nd.substring(4,6) + '-' + nd.substring(6,8));
        var diffDays = Math.ceil((nextDateObj - today) / 86400000);
        if (diffDays <= 30 && diffDays >= 0) {
          survivalAlerts.push({
            clientName: c.name || '',
            policyCode: p.policyCode || '',
            insuranceName: p.insuranceName || '',
            amount: p.survivalBenefit.amount || 0,
            nextDate: formatDate(nd),
            daysLeft: diffDays
          });
        }
      }
    });
  });
  var survivalAlertHtml = '';
  if (survivalAlerts.length > 0) {
    survivalAlertHtml = '<div class="card" style="border:2px solid #ef4444;"><div class="card-title" style="color:#dc2626;border-bottom-color:#ef4444;">⚠ 生存金即将到期提醒（30天内）</div>';
    survivalAlerts.forEach(function(a) {
      survivalAlertHtml += '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px;background:#fef2f2;border-radius:8px;margin-bottom:6px;flex-wrap:wrap;gap:8px;">' +
        '<div><strong>' + a.clientName + '</strong> - ' + a.insuranceName + ' (' + a.policyCode + ')</div>' +
        '<div style="display:flex;align-items:center;gap:12px;">' +
        '<span style="font-weight:700;color:#0f172a;">' + formatMoney(a.amount) + ' 元</span>' +
        '<span style="font-weight:700;color:#dc2626;">' + a.nextDate + '</span>' +
        '<span class="tag tag-red">仅剩 ' + a.daysLeft + ' 天</span>' +
        '</div></div>';
    });
    survivalAlertHtml += '</div>';
  }

  /* 险种分布 - 简易柱状图 */
  var chartHtml = '<div style="overflow-x:auto;padding-bottom:8px;"><div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;min-height:200px;padding:10px 4px 4px;">';
  var maxCount = 1;
  Object.values(typeMap).forEach(function(v) { if (v > maxCount) maxCount = v; });
  Object.keys(typeMap).sort(function(a,b) { return typeMap[b] - typeMap[a]; }).forEach(function(type) {
    var count = typeMap[type];
    var pct = Math.round(count / maxCount * 140);
    chartHtml += '<div style="display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px;">' +
      '<div style="font-size:12px;font-weight:600;color:#1e40af;">' + count + '</div>' +
      '<div style="width:42px;height:' + pct + 'px;background:linear-gradient(to top,#3b82f6,#60a5fa);border-radius:6px 6px 0 0;transition:height 0.3s;min-height:4px;"></div>' +
      '<div style="font-size:11px;color:#64748b;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + type + '">' + type + '</div>' +
      '</div>';
  });
  chartHtml += '</div></div>';
  document.getElementById('insuranceTypeChart').innerHTML = chartHtml || '<div class="empty-state"><p>暂无数据</p></div>';

  /* 生存金提醒 */
  document.getElementById('survivalAlertContainer').innerHTML = survivalAlertHtml;

  /* 管理员面板 */
  if (currentUser === 'admin') {
    document.getElementById('adminPanel').classList.remove('hidden');
    renderAdminPanel();
  } else {
    document.getElementById('adminPanel').classList.add('hidden');
  }
}

/* 管理员面板 */
function renderAdminPanel() {
  var users = getUsers();
  var html = '';
  users.forEach(function(u) {
    var uData = JSON.parse(localStorage.getItem('policy_data_' + u.username) || '[]');
    var policyCount = 0;
    uData.forEach(function(c) { policyCount += (c.policies || []).length; });
    html += '<div class="user-stat-card">' +
      '<div><strong>' + u.username + '</strong> ' +
      '<span class="tag tag-blue">' + (u.username === 'admin' ? '管理员' : '普通用户') + '</span></div>' +
      '<div style="font-size:13px;color:#64748b;">客户 ' + uData.length + ' | 保单 ' + policyCount +
      ' | 最后登录: ' + (u.lastLogin ? new Date(u.lastLogin).toLocaleString('zh-CN') : '从未') + '</div>' +
      '</div>';
  });
  document.getElementById('adminUserList').innerHTML = html || '<p>暂无用户数据</p>';
}

/* ======== 查询功能 ======== */

/* 切换高级搜索 */
function toggleAdvancedSearch() {
  document.getElementById('advancedSearch').classList.toggle('show');
}

/* 清空搜索 */
function clearSearch() {
  document.getElementById('searchInput').value = '';
  clearAdvancedSearch();
  handleSearch();
}

/* 清空高级搜索条件 */
function clearAdvancedSearch() {
  ['advPolicyCode','advInsuranceName','advStatus','advDateFrom','advDateTo',
   'advPremMin','advPremMax','advSumMin','advSumMax','advPayTerm','advInsuredId','advPhone'
  ].forEach(function(id) { document.getElementById(id).value = ''; });
}

/* 执行搜索 */
function handleSearch() {
  var keyword = document.getElementById('searchInput').value.trim().toLowerCase();

  /* 高级搜索条件 */
  var advPolicyCode = document.getElementById('advPolicyCode').value.trim();
  var advInsuranceName = document.getElementById('advInsuranceName').value.trim().toLowerCase();
  var advStatus = document.getElementById('advStatus').value;
  var advDateFrom = document.getElementById('advDateFrom').value;
  var advDateTo = document.getElementById('advDateTo').value;
  var advPremMin = parseFloat(document.getElementById('advPremMin').value) || 0;
  var advPremMax = parseFloat(document.getElementById('advPremMax').value) || Infinity;
  var advSumMin = parseFloat(document.getElementById('advSumMin').value) || 0;
  var advSumMax = parseFloat(document.getElementById('advSumMax').value) || Infinity;
  var advPayTerm = document.getElementById('advPayTerm').value.trim();
  var advInsuredId = document.getElementById('advInsuredId').value.trim();
  var advPhone = document.getElementById('advPhone').value.trim();

  /* 过滤客户 */
  var filtered = clientData.map(function(client, idx) {
    /* 过滤保单 */
    var matchedPolicies = (client.policies || []).filter(function(p) {
      /* 基础关键词搜索 */
      if (keyword) {
        var nameMatch = (client.name || '').toLowerCase().includes(keyword) ||
                        (p.insured || '').toLowerCase().includes(keyword);
        if (!nameMatch) return false;
      }
      /* 高级搜索条件 */
      if (advPolicyCode && (p.policyCode || '') !== advPolicyCode) return false;
      if (advInsuranceName && !(p.insuranceName || '').toLowerCase().includes(advInsuranceName)) return false;
      if (advStatus && (p.status || '') !== advStatus) return false;
      if (advDateFrom && toYMD(p.effectiveDate) < toYMD(advDateFrom)) return false;
      if (advDateTo && toYMD(p.effectiveDate) > toYMD(advDateTo)) return false;
      var prem = parseFloat(p.annualPremium) || 0;
      if (prem < advPremMin || prem > advPremMax) return false;
      var sum = parseFloat(p.sumInsured) || 0;
      if (sum < advSumMin || sum > advSumMax) return false;
      if (advPayTerm && String(p.paymentTerm || '') !== advPayTerm) return false;
      if (advInsuredId && (p.insuredId || '') !== advInsuredId) return false;
      if (advPhone && (client.phone || '') !== advPhone && (p.insuredPhone || '') !== advPhone) return false;
      return true;
    });
    return { clientIdx: idx, client: client, matchedPolicies: matchedPolicies };
  }).filter(function(item) { return item.matchedPolicies.length > 0 || (!keyword && !advPolicyCode && !advInsuranceName && !advStatus && !advDateFrom && !advDateTo && advPremMin === 0 && advPremMax === Infinity && advSumMin === 0 && advSumMax === Infinity && !advPayTerm && !advInsuredId && !advPhone); });

  /* 如果没有高级条件且有关键词，只返回匹配的客户 */
  var hasAdv = advPolicyCode || advInsuranceName || advStatus || advDateFrom || advDateTo ||
    advPremMin > 0 || advPremMax < Infinity || advSumMin > 0 || advSumMax < Infinity ||
    advPayTerm || advInsuredId || advPhone;

  if (!hasAdv && keyword) {
    filtered = filtered.filter(function(item) { return item.matchedPolicies.length > 0; });
  }
  if (!hasAdv && !keyword) {
    filtered = clientData.map(function(client, idx) {
      return { clientIdx: idx, client: client, matchedPolicies: client.policies || [] };
    });
  }

  /* 排序 */
  var sortBy = document.getElementById('sortSelect').value;
  filtered.sort(function(a, b) {
    switch(sortBy) {
      case 'name':
        return (a.client.name || '').localeCompare(b.client.name || '', 'zh-CN');
      case 'premium-desc':
        var aPrem = 0, bPrem = 0;
        a.matchedPolicies.forEach(function(p) { aPrem += parseFloat(p.annualPremium) || 0; });
        b.matchedPolicies.forEach(function(p) { bPrem += parseFloat(p.annualPremium) || 0; });
        return bPrem - aPrem;
      case 'premium-asc':
        var aP = 0, bP = 0;
        a.matchedPolicies.forEach(function(p) { aP += parseFloat(p.annualPremium) || 0; });
        b.matchedPolicies.forEach(function(p) { bP += parseFloat(p.annualPremium) || 0; });
        return aP - bP;
      case 'sumInsured-desc':
        var aS = 0, bS = 0;
        a.matchedPolicies.forEach(function(p) { aS += parseFloat(p.sumInsured) || 0; });
        b.matchedPolicies.forEach(function(p) { bS += parseFloat(p.sumInsured) || 0; });
        return bS - aS;
      case 'sumInsured-asc':
        var aS2 = 0, bS2 = 0;
        a.matchedPolicies.forEach(function(p) { aS2 += parseFloat(p.sumInsured) || 0; });
        b.matchedPolicies.forEach(function(p) { bS2 += parseFloat(p.sumInsured) || 0; });
        return aS2 - bS2;
      case 'date-desc':
        return (b.client.policies && b.client.policies[0] && b.client.policies[0].effectiveDate || '').localeCompare(a.client.policies && a.client.policies[0] && a.client.policies[0].effectiveDate || '');
      case 'date-asc':
        return (a.client.policies && a.client.policies[0] && a.client.policies[0].effectiveDate || '').localeCompare(b.client.policies && b.client.policies[0] && b.client.policies[0].effectiveDate || '');
      default: return 0;
    }
  });

  /* 统计信息 */
  var totalPolicies = 0;
  filtered.forEach(function(item) { totalPolicies += item.matchedPolicies.length; });
  document.getElementById('searchResultInfo').textContent =
    '共找到 ' + filtered.length + ' 个客户，' + totalPolicies + ' 条保单';

  renderClientList(filtered);
}

/* 渲染客户列表 - 卡片式CRM布局 */
function renderClientList(filtered) {
  var html = '';
  if (filtered.length === 0) {
    html = '<div class="empty-state"><div class="empty-icon">&#128269;</div><p>未找到匹配的客户</p>' +
           '<button class="btn-primary" onclick="openAddClientModal()">添加新客户</button></div>';
  } else {
    filtered.forEach(function(item) {
      var c = item.client;
      var pCount = item.matchedPolicies.length;
      var vCount = item.matchedPolicies.filter(function(p) { return p.status === '有效'; }).length;
      var totalPrem = 0;
      item.matchedPolicies.forEach(function(p) { totalPrem += parseFloat(p.annualPremium) || 0; });
      var isActive = selectedClientIdx === item.clientIdx ? ' active' : '';

      /* 计算年龄 */
      var age = '';
      var idCard = c.idCard || '';
      if (idCard.length >= 14) {
        try {
          var by = parseInt(idCard.substring(6, 10));
          if (by > 1900 && by < 2100) {
            age = (new Date().getFullYear() - by) + '岁';
          }
        } catch(e) {}
      }
      var familyCount = (c.familyMembers || []).length;
      var address = c.address || '';

      /* 获取最新联系记录 */
      var latestContact = null;
      if (c.contactHistory && c.contactHistory.length > 0) {
        var sorted = c.contactHistory.slice().sort(function(a, b) {
          return (b.date || '').localeCompare(a.date || '');
        });
        latestContact = sorted[0];
      }

      /* 联系记录状态颜色 */
      var contactColor = '';
      var contactBg = '';
      if (latestContact) {
        var st = latestContact.status || '';
        if (st === '已加微信' || st === '已电话联系' || st === '面见客户') {
          contactColor = '#065f46'; contactBg = '#ecfdf5';
        } else if (st === '未联系上' || st === '电话挂断') {
          contactColor = '#991b1b'; contactBg = '#fef2f2';
        } else {
          contactColor = '#92400e'; contactBg = '#fffbeb';
        }
      }

      html += '<div class="crm-client-card' + isActive + '" onclick="selectClient(' + item.clientIdx + ')" style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin-bottom:12px;cursor:pointer;transition:all 0.25s;position:relative;">';

      /* 顶部：姓名 + 保单数徽章 */
      html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">';
      html += '<div style="font-size:17px;font-weight:800;color:#0f172a;">' + (c.name || '未命名');
      if (hasIncompleteInfo(c)) {
        html += ' <span class="tag tag-red" style="font-size:10px;padding:2px 6px;vertical-align:middle;">信息不完整</span>';
      }
      html += '</div>';
      html += '<div style="background:#1a2744;color:#fff;border-radius:20px;min-width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;padding:0 10px;">' + pCount + '</div>';
      html += '</div>';

      /* ID + 手机号 */
      var maskedId = idCard.length > 10 ? idCard.substring(0, 6) + '********' + idCard.substring(idCard.length - 4) : idCard;
      html += '<div style="font-size:13px;color:#64748b;margin-bottom:4px;">' +
        (maskedId ? maskedId : '') + (c.phone ? ' · ' + c.phone : '') + '</div>';

      /* 地址 */
      if (address) {
        html += '<div style="font-size:12px;color:#94a3b8;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + address + '</div>';
      }

      /* 统计行：年龄、保单、家人 */
      html += '<div style="display:flex;gap:12px;font-size:12px;color:#64748b;margin-bottom:10px;flex-wrap:wrap;">';
      if (age) html += '<span>年龄：' + age + '</span>';
      html += '<span>保单：' + pCount + '份</span>';
      html += '<span>家人：' + familyCount + '人</span>';
      html += '<span>年保费：' + formatMoney(totalPrem) + '</span>';
      html += '</div>';

      /* 联系记录条 */
      if (latestContact) {
        html += '<div style="display:flex;align-items:center;gap:8px;background:' + contactBg + ';border-radius:8px;padding:8px 12px;font-size:13px;color:' + contactColor + ';font-weight:600;">';
        html += '<span style="font-size:16px;">📞</span>';
        html += '<span>' + (latestContact.status || '') + '</span>';
        html += '<span style="margin-left:auto;font-weight:500;">' + formatDate(latestContact.date) + '</span>';
        html += '</div>';
      } else {
        html += '<div style="display:flex;align-items:center;gap:8px;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:8px;padding:8px 12px;font-size:12px;color:#94a3b8;">📞 暂无联系记录，点击添加</div>';
      }

      html += '</div>';
    });
  }
  document.getElementById('clientList').innerHTML = html;
}

/* 选择客户 - 跳转到详情页 */
function selectClient(idx) {
  selectedClientIdx = idx;
  document.getElementById('queryListView').style.display = 'none';
  document.getElementById('clientDetailView').style.display = 'block';
  renderDetailPanel(idx);
  window.scrollTo(0, 0);
}

/* 返回查询列表 */
function backToQueryList() {
  document.getElementById('queryListView').style.display = 'block';
  document.getElementById('clientDetailView').style.display = 'none';
  selectedClientIdx = -1;
  handleSearch();
  window.scrollTo(0, 0);
}

/* 滚动到保单详情锚点 */
function scrollToPolicyDetail(anchorId) {
  var el = document.getElementById(anchorId);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    /* 高亮闪烁 */
    el.style.transition = 'box-shadow 0.3s';
    el.style.boxShadow = '0 0 0 4px rgba(26,39,68,0.3)';
    setTimeout(function() { el.style.boxShadow = ''; }, 1500);
  }
}

/* 渲染详情面板 */
function renderDetailPanel(idx) {
  var panel = document.getElementById('detailPanel');
  var c = clientData[idx];
  if (!c) { panel.classList.remove('show'); return; }

  panel.classList.add('show');

  /* 返回按钮 */
  var html = '<button class="back-btn" onclick="backToQueryList()">&#8592; 返回查询列表</button>';

  /* 客户姓名单独显示 - 高亮卡片 + 年龄 */
  /* 计算周岁年龄 */
  var ageDisplay = '';
  if (c.idCard && c.idCard.length >= 14) {
    try {
      var by = parseInt(c.idCard.substring(6, 10));
      var bm = parseInt(c.idCard.substring(10, 12));
      var bd = parseInt(c.idCard.substring(12, 14));
      if (by > 1900 && by < 2100) {
        var now = new Date();
        var ageYears = now.getFullYear() - by;
        /* 检查是否已过生日 */
        var hasBirthdayThisYear = (now.getMonth() + 1 > bm) || (now.getMonth() + 1 === bm && now.getDate() >= bd);
        if (!hasBirthdayThisYear) ageYears--;
        ageDisplay = ' <span style="font-size:22px;font-weight:400;color:rgba(255,255,255,0.7);">' + ageYears + '岁</span>';
      }

    '<h3>' + (c.name || '未命名') + ageDisplay + '</h3>' +

    '</div>';

  /* 联系记录 - 放在最上面 */
  html += '<div class="card"><div class="card-title">联系记录' +

      /* 金额与缴费信息 - 深色系 */

        '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;font-size:13px;">' +

        (p.parentPolicyCode ? '<p><strong>关联主险：</strong>' + p.parentPolicyCode + '</p>' : '') +
        '</div></div>';

      /* 生存金信息 */
      if (p.survivalBenefit && p.survivalBenefit.type) {
        var sb = p.survivalBenefit;
        var typeLabel = sb.type === 'annual' ? '每年领取' : sb.type === 'triennial' ? '每3年领取' : '到期领取';
        /* 计算距离下次领取还有多少天 */
        var daysUntilNext = '';
        var alertClass = '';
        if (sb.nextDate) {
          var nextDateObj = new Date(sb.nextDate.substring(0, 4) + '-' + sb.nextDate.substring(4, 6) + '-' + sb.nextDate.substring(6, 8));
          var today = new Date();
          today.setHours(0,0,0,0);
          var diffDays = Math.ceil((nextDateObj - today) / 86400000);
          if (diffDays <= 30 && diffDays >= 0) {
            alertClass = ' style="border-color:#ef4444 !important;background:#fef2f2 !important;"';
            daysUntilNext = '<span style="color:#dc2626;font-weight:800;font-size:14px;">⚠ 仅剩 ' + diffDays + ' 天</span>';
          } else if (diffDays < 0) {
            daysUntilNext = '<span style="color:#dc2626;font-weight:700;">已过期 ' + Math.abs(diffDays) + ' 天</span>';
          } else {
            daysUntilNext = '<span style="color:#475569;">还有 ' + diffDays + ' 天</span>';
          }
        }
        detail += '<div style="background:#f0fdf4;border:2px solid #22c55e;border-radius:10px;padding:16px;margin-bottom:10px;">' +
          '<h6 style="font-size:14px;color:#166534;margin-bottom:12px;border-bottom:2px solid #86efac;padding-bottom:8px;font-weight:700;">生存金信息</h6>' +
          '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;font-size:13px;">' +
          '<div style="text-align:center;padding:10px;background:#ffffff;border:1.5px solid #86efac;border-radius:8px;"><div style="font-size:12px;color:#166534;margin-bottom:4px;font-weight:700;">领取方式</div><div style="font-size:18px;font-weight:800;color:#166534;">' + typeLabel + '</div></div>' +
          '<div style="text-align:center;padding:10px;background:#ffffff;border:1.5px solid #fbbf24;border-radius:8px;"><div style="font-size:12px;color:#92400e;margin-bottom:4px;font-weight:700;">生存金金额</div><div style="font-size:22px;font-weight:900;color:#b45309;">' + formatMoney(sb.amount) + ' 元</div></div>' +
          '</div>' +
          '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;font-size:14px;margin-top:12px;color:#0f172a;">' +
          (sb.startDate ? '<p><strong>起领日期：</strong>' + formatDate(sb.startDate) + '</p>' : '') +
          '<p><strong>最近领取：</strong>' + formatDate(sb.lastDate) + '</p>' +
          '<p' + alertClass + '><strong>下次领取：</strong>' + formatDate(sb.nextDate) + ' ' + daysUntilNext + '</p>' +
          (sb.note ? '<p><strong>备注：</strong>' + sb.note + '</p>' : '') +
          '</div></div>';
      }

      /* 受益人 */
      if (p.beneficiaries && p.beneficiaries.length > 0) {
        detail += '<div style="margin-bottom:10px;"><h6 style="font-size:13px;color:#1e293b;margin-bottom:6px;font-weight:700;">受益人</h6>';
        p.beneficiaries.forEach(function(b) {
          detail += '<span style="display:inline-block;background:#f1f5f9;padding:4px 12px;border-radius:6px;font-size:12px;margin-right:6px;margin-bottom:4px;color:#1e293b;">' +
            (b.name || '') + ' - ' + (b.quota || '') + '%</span>';
        });
        detail += '</div>';
      }

      /* 备注 */
      if (p.remark) {
        detail += '<div style="background:#fff7ed;border:1px solid #fdba74;border-radius:6px;padding:8px 12px;margin-bottom:10px;font-size:13px;color:#1e293b;">' +
          '<strong>备注：</strong>' + p.remark + '</div>';
      }

      /* 服务记录 */
      detail += '<div style="margin-top:8px;">' +
        '<h6 style="font-size:13px;color:#1e293b;margin-bottom:6px;font-weight:700;">服务记录</h6>';
      if (p.serviceRecords && p.serviceRecords.length > 0) {
        detail += '<div class="timeline">';
        p.serviceRecords.forEach(function(sr) {
          detail += '<div class="timeline-item">' +
            '<div class="timeline-date">' + formatDate(sr.date) + '</div>' +
            '<div class="timeline-content">' + (sr.content || '') + '</div></div>';
        });
        detail += '</div>';
      } else {
        detail += '<p style="font-size:12px;color:#6b7280;">暂无服务记录</p>';
      }
      detail += '<button class="btn-sm btn-outline" style="margin-top:8px;" onclick="openAddServiceModal(' + idx + ',' + pIdx + ')">添加服务记录</button>';
      detail += '</div>';

      detail += '</div>'; /* policy-detail-body */
      detail += '</div>'; /* policy-detail-card */
      return detail;
    }

    /* 渲染主险及其附加险/万能险分组 */
    mainPolicies.forEach(function(mp) {
      html += '<div class="policy-group">';
      html += '<div class="policy-group-main">主险：' + (mp.insuranceName || '') + ' (' + (mp.policyCode || '') + ')</div>';
      html += renderPolicyDetail(mp);

      /* 查找关联的附加险 */
      var associatedAddons = addonPolicies.filter(function(ap) {
        return ap.parentPolicyCode && ap.parentPolicyCode === mp.policyCode;
      });
      associatedAddons.forEach(function(ap) {
        usedAddons.push(ap);
        html += '<div class="policy-group-addon">附加险：' + (ap.insuranceName || '') + ' (' + (ap.policyCode || '') + ')</div>';
        html += renderPolicyDetail(ap);
      });

      /* 查找关联的万能险 */
      var associatedUniversal = universalPolicies.filter(function(up) {
        return up.parentPolicyCode && up.parentPolicyCode === mp.policyCode;
      });
      associatedUniversal.forEach(function(up) {
        usedAddons.push(up);
        html += '<div class="policy-group-universal">万能险：' + (up.insuranceName || '') + ' (' + (up.policyCode || '') + ')</div>';
        html += renderPolicyDetail(up);
      });

      html += '</div>';
    });

    /* 未关联的附加险 */
    var unlinkedAddons = addonPolicies.filter(function(ap) { return usedAddons.indexOf(ap) === -1; });
    unlinkedAddons.forEach(function(ap) {
      html += '<div class="policy-group">';
      html += '<div class="policy-group-addon">附加险（未关联主险）：' + (ap.insuranceName || '') + ' (' + (ap.policyCode || '') + ')</div>';
      html += renderPolicyDetail(ap);
      html += '</div>';
    });

    /* 未关联的万能险 */
    var unlinkedUniversal = universalPolicies.filter(function(up) { return usedAddons.indexOf(up) === -1; });
    unlinkedUniversal.forEach(function(up) {
      html += '<div class="policy-group">';
      html += '<div class="policy-group-universal">万能险（未关联主险）：' + (up.insuranceName || '') + ' (' + (up.policyCode || '') + ')</div>';
      html += renderPolicyDetail(up);
      html += '</div>';
    });

    html += '</div>';
  }

  panel.innerHTML = html;
}

/* 填充关联主险保单下拉 */
function populateParentPolicyDropdown(clientIdx, selectedCode) {
  var select = document.getElementById('parentPolicyCode');
  select.innerHTML = '<option value="">不关联（独立保单）</option>';
  var c = clientData[clientIdx];
  if (!c || !c.policies) return;
  c.policies.forEach(function(p) {

      var opt = document.createElement('option');

      if (p.policyCode === selectedCode) opt.selected = true;
      select.appendChild(opt);

  if (clientIdx >= 0 && clientData[clientIdx]) {

/* 被保人关系变更时自动添加家庭成员 */
function onInsuredRelationChange() {
  var relation = document.getElementById('insuredRelation').value;
  if (!relation || relation === '本人') return;
  
  var insuredName = document.getElementById('insuredName').value.trim();
  var insuredId = document.getElementById('insuredId').value.trim();
  var insuredPhone = document.getElementById('insuredPhone').value.trim();
  var insuredAddress = document.getElementById('insuredAddress').value.trim();
  
  if (!insuredName) return;
  
  /* 检查是否已存在 */
  var familyList = document.getElementById('familyMembersList');
  var existing = familyList.querySelectorAll('.fm-name');
  for (var i = 0; i < existing.length; i++) {
    if (existing[i].value.trim() === insuredName) return;
  }
  
  /* 计算年龄 */
  var age = '';
  if (insuredId.length >= 14) {
    try {
      var by = parseInt(insuredId.substring(6, 10));
      if (by > 1900 && by < 2100) {
        age = (new Date().getFullYear() - by);
      }
    } catch(e) {}
  }
  
  /* 添加家庭成员 */
  var container = document.getElementById('familyMembersList');
  var div = document.createElement('div');
  div.innerHTML = buildFamilyMemberField({
    name: insuredName,
    relationship: relation,
    idCard: insuredId,
    phone: insuredPhone,
    note: (age ? '年龄' + age + '岁' : '') + (insuredAddress ? ' | ' + insuredAddress : '')
  });
  container.appendChild(div.firstElementChild);
}

/* 保存保单 */
function savePolicy() {
  var policyCode = document.getElementById('policyCode').value.trim();
  var insuranceName = document.getElementById('insuranceName').value.trim();
  if (!policyCode || !insuranceName) {
    showToast('请填写保单代码和险种名称', 'warning');
    return;
  }

  /* 自动收录险种到险种库 */
  var codeType = document.getElementById('codeType').value.trim();
  if (insuranceName && codeType) {
    addToInsuranceTypeLib(insuranceName, codeType);
  }

  /* 收集受益人 */
  var beneficiaries = [];
  var benContainers = document.getElementById('beneficiariesList').children;
  for (var i = 0; i < benContainers.length; i++) {
    var benName = benContainers[i].querySelector('.ben-name').value.trim();
    if (benName) {
      beneficiaries.push({
        name: benName,
        quota: benContainers[i].querySelector('.ben-quota').value.trim()
      });
    }
  }

  var clientIdx = parseInt(document.getElementById('policyClientIndex').value);
  var c = clientData[clientIdx];
  var insuredName = document.getElementById('insuredName').value.trim() || c.name;
  var insuredRelation = document.getElementById('insuredRelation').value;
  /* 被保人为本人时，空字段自动从客户信息回填，确保数据一致 */
  var isSelf = (insuredRelation === '本人') || (!insuredRelation && insuredName === (c.name || ''));
  var insuredId = document.getElementById('insuredId').value.trim();
  var insuredPhone = document.getElementById('insuredPhone').value.trim();
  var insuredAddress = document.getElementById('insuredAddress').value.trim();
  if (isSelf) {
    if (!insuredId) insuredId = c.idCard || '';
    if (!insuredPhone) insuredPhone = c.phone || '';
    if (!insuredAddress) insuredAddress = c.address || '';
  }

  var policyObj = {
    policyCode: policyCode,
    insuranceName: insuranceName,
    codeType: codeType,
    mainType: document.getElementById('mainType').value,
    parentPolicyCode: document.getElementById('parentPolicyCode').value,
    status: document.getElementById('policyStatus').value,
    hasDividend: document.getElementById('hasDividend').checked,
    effectiveDate: toYMD(document.getElementById('effectiveDate').value),
    maturityDate: toYMD(document.getElementById('maturityDate').value),
    paymentMethod: document.getElementById('paymentMethod').value,
    annualPremium: document.getElementById('annualPremium').value,
    sumInsured: document.getElementById('sumInsured').value,
    paymentTerm: document.getElementById('paymentTerm').value,
    insured: insuredName,
    insuredRelation: insuredRelation,
    insuredId: insuredId,
    insuredPhone: insuredPhone,
    insuredAddress: insuredAddress,
    beneficiaries: beneficiaries,
    remark: document.getElementById('policyRemark').value.trim(),
    survivalBenefit: {
      type: document.getElementById('survivalBenefitType').value,
      amount: document.getElementById('survivalBenefitAmount').value,
      startDate: toYMD(document.getElementById('survivalStartDate').value),
      lastDate: toYMD(document.getElementById('survivalLastDate').value),
      nextDate: toYMD(document.getElementById('survivalNextDate').value),
      note: document.getElementById('survivalBenefitNote').value.trim()
    },
    extraFields: {},
    serviceRecords: []
  };

  var editIdx = parseInt(document.getElementById('policyEditIndex').value);

  if (editIdx >= 0) {
    /* 编辑保单：保留服务记录 */
    policyObj.serviceRecords = clientData[clientIdx].policies[editIdx].serviceRecords || [];
    clientData[clientIdx].policies[editIdx] = policyObj;
    showToast('保单已更新', 'success');
  } else {
    if (!clientData[clientIdx].policies) clientData[clientIdx].policies = [];
    clientData[clientIdx].policies.push(policyObj);

/* ======== 保单信息完整性检查 ======== */

/* 获取投保人信息缺失字段 */
function getClientIncompleteFields(c) {
  var missing = [];
  if (!c.idCard || c.idCard.trim() === '') missing.push('身份证');
  if (!c.phone || c.phone.trim() === '') missing.push('手机号码');
  if (!c.address || c.address.trim() === '') missing.push('联系地址');
  return missing;
}

/* 获取保单信息缺失字段 */
function getPolicyIncompleteFields(c, p) {
  var missing = [];
  /* 当被保人是投保人本人时，投保人信息已覆盖被保人信息，无需重复校验 */
  var isSelf = (p.insuredRelation === '本人') || (!p.insuredRelation && (p.insured || '') === (c.name || ''));
  if (!isSelf) {
    if (!p.insuredId || p.insuredId.trim() === '') missing.push('被保人身份证');
    if (!p.insuredPhone || p.insuredPhone.trim() === '') missing.push('被保人手机号');
    if (!p.insuredAddress || p.insuredAddress.trim() === '') missing.push('被保人联系地址');
  }
  return missing;
}

/* 获取客户所有保单的完整性问题汇总 */
function getClientAllIncompleteFields(c) {
  var clientMissing = getClientIncompleteFields(c);
  var policyMissing = [];
  if (c.policies) {
    c.policies.forEach(function(p) {
      var pm = getPolicyIncompleteFields(c, p);
      if (pm.length > 0) {
        policyMissing.push({ policyCode: p.policyCode, fields: pm });
      }
    });
  }
  return { clientMissing: clientMissing, policyMissing: policyMissing };
}

/* 检查是否有任何不完整信息 */
function hasIncompleteInfo(c) {
  var result = getClientAllIncompleteFields(c);
  return result.clientMissing.length > 0 || result.policyMissing.length > 0;
}

/* 从现有保单数据中同步险种到险种库 */
function syncExistingPoliciesToLib() {
  var lib = getInsuranceTypeLib();
  var libNames = lib.map(function(item) { return (item.insuranceName || '').trim(); });
  var addedCount = 0;
  var noNameCount = 0;

  clientData.forEach(function(c) {
    (c.policies || []).forEach(function(p) {
      var name = (p.insuranceName || '').trim();
      var code = (p.codeType || '').trim();

      if (code) {
        /* 有代码，不管有没有名称都加入 */
        if (name && libNames.indexOf(name) === -1) {
          lib.push({ insuranceName: name, codeType: code });
          libNames.push(name);
          addedCount++;
        } else if (!name) {
          /* 有代码但没有名称，用代码作为临时名称 */
          var placeholderName = '[待补充] ' + code;
          if (libNames.indexOf(placeholderName) === -1) {
            lib.push({ insuranceName: placeholderName, codeType: code });
            libNames.push(placeholderName);
            noNameCount++;
          }
        } else if (name && libNames.indexOf(name) !== -1) {
          /* 名称已存在但代码可能不同，更新代码 */
          var existing = lib.find(function(item) { return (item.insuranceName || '').trim() === name; });
          if (existing && existing.codeType !== code) {
            existing.codeType = code;
          }
        }
      }
    });
  });

  saveInsuranceTypeLib(lib);

  if (noNameCount > 0) {
    showToast('已自动收录 ' + addedCount + ' 个险种，其中 ' + noNameCount + ' 个缺少名称（已标记为[待补充]），请在设置-险种库管理中手动修改名称', 'warning');
  } else if (addedCount > 0) {
    showToast('已自动收录 ' + addedCount + ' 个新险种到险种库', 'success');
  }
}

/* 添加到险种库（去重） */
function addToInsuranceTypeLib(name, code) {
  if (!name || !code) return false;

  var lib = getInsuranceTypeLib();
  var exists = lib.some(function(item) {

  });
  if (exists) return false;
  lib.push({ insuranceName: name, codeType: code });

  return true;
}

/* 安全转义：用于生成 HTML 属性中的 JavaScript 字符串字面量（注意：& 必须最先转义，避免破坏后续实体） */
function escapeForJsAttr(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '');
}

function renderInsuranceTypeLib() {

  var html = '<table class="policy-table"><thead><tr><th>险种名称</th><th>险种代码</th><th>操作</th></tr></thead><tbody>';
  lib.forEach(function(item) {
    var safeName = escapeForJsAttr(item.insuranceName);
    var safeCode = escapeForJsAttr(item.codeType);
    html += '<tr>' +
      '<td>' + (item.insuranceName || '') + '</td>' +
      '<td>' + (item.codeType || '') + '</td>' +
      '<td>' +
      '<button class="btn-sm btn-outline" onclick="editInsuranceType(\'' + safeName + '\', \'' + safeCode + '\')">编辑</button> ' +

/* 编辑险种库条目 */
function editInsuranceType(oldName, code) {
  oldName = (oldName || '').trim();
  var newName = prompt('修改险种名称：', oldName);
  if (newName === null) return;
  newName = newName.trim();
  if (!newName) { showToast('险种名称不能为空', 'warning'); return; }
  var newCode = prompt('修改险种代码：', code);
  if (newCode === null) return;
  newCode = newCode.trim();
  if (!newCode) { showToast('险种代码不能为空', 'warning'); return; }
  
  var lib = getInsuranceTypeLib();
  var found = false;
  for (var i = 0; i < lib.length; i++) {
    if ((lib[i].insuranceName || '').trim() === oldName) {
      lib[i].insuranceName = newName;
      lib[i].codeType = newCode;
      found = true;
      break;
    }
  }
  if (found) {
    saveInsuranceTypeLib(lib);
    renderInsuranceTypeLib();
    updateInsuranceTypeDatalist();
    /* 同步更新所有保单中使用该险种名称的记录 */
    var syncCount = 0;
    clientData.forEach(function(c) {
      (c.policies || []).forEach(function(p) {
        var pName = (p.insuranceName || '').trim();
        if (pName === oldName) {
          p.insuranceName = newName;
          p.codeType = newCode;
          syncCount++;
        }
      });
    });
    if (syncCount > 0) {
      savePolicyData();
      showToast('险种已更新，已同步 ' + syncCount + ' 份保单', 'success');
    } else {
      showToast('险种已更新', 'success');
    }
  }
}

/* 自动计算下次领取日期 */
function autoCalcSurvivalNextDate() {
  var type = document.getElementById('survivalBenefitType').value;
  var startDateStr = document.getElementById('survivalStartDate').value;
  var lastDateStr = document.getElementById('survivalLastDate').value;
  var nextDateInput = document.getElementById('survivalNextDate');

  if (!type) {
    return;
  }

  /* 使用起领日作为计算基准 */
  var baseDateStr = startDateStr || lastDateStr;
  if (!baseDateStr) return;

  var parts = baseDateStr.split('-');
  if (parts.length !== 3) return;
  var y = parseInt(parts[0]);
  var m = parseInt(parts[1]);
  var d = parseInt(parts[2]);

  var nextDate = null;
  var today = new Date();

  if (type === 'annual') {
    /* 从起领日开始，计算到当前最近的未领取年份 */
    var startDate = new Date(y, m - 1, d);
    nextDate = new Date(startDate);
    while (nextDate <= today) {
      nextDate.setFullYear(nextDate.getFullYear() + 1);
    }
  } else if (type === 'triennial') {
    var startDate = new Date(y, m - 1, d);
    nextDate = new Date(startDate);
    while (nextDate <= today) {
      nextDate.setFullYear(nextDate.getFullYear() + 3);
    }
  } else if (type === 'maturity') {
    nextDateInput.value = '';
    return;
  }

  if (nextDate) {
    var ny = nextDate.getFullYear();
    var nm = String(nextDate.getMonth() + 1).padStart(2, '0');
    var nd = String(nextDate.getDate()).padStart(2, '0');
    nextDateInput.value = ny + '-' + nm + '-' + nd;
  }
}

/* 渲染提醒统计 */
function renderReminderStats() {
  var total = reminderData.length;
  var pending = reminderData.filter(function(r) { return !r.dismissed && r.enabled; }).length;
  var processed = reminderData.filter(function(r) { return r.dismissed; }).length;
  var today = new Date().toISOString().slice(0, 10).replace(/-/g, '');
  var todayCount = reminderData.filter(function(r) {
    return !r.dismissed && r.enabled && r.dueDate <= today;
  }).length;

  document.getElementById('reminderStats').innerHTML = '' +
    '<div class="stat-card"><div class="stat-value">' + total + '</div><div class="stat-label">总提醒数</div></div>' +
    '<div class="stat-card yellow"><div class="stat-value">' + todayCount + '</div><div class="stat-label">今日待办</div></div>' +
    '<div class="stat-card green"><div class="stat-value">' + pending + '</div><div class="stat-label">待处理</div></div>' +
    '<div class="stat-card"><div class="stat-value">' + processed + '</div><div class="stat-label">已处理</div></div>';
}

/* 渲染提醒列表 */
function renderReminders() {
  renderReminderStats();
  var today = new Date().toISOString().slice(0, 10).replace(/-/g, '');
  var sevenDaysLater = new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10).replace(/-/g, '');

  var filtered = reminderData.filter(function(r) {
    if (reminderFilter === 'all') return true;
    if (reminderFilter === 'overdue') return !r.dismissed && r.enabled && r.dueDate < today;
    if (reminderFilter === 'urgent') return !r.dismissed && r.enabled && r.dueDate >= today && r.dueDate <= sevenDaysLater;
    if (reminderFilter === 'dismissed') return r.dismissed;
    return true;
  });

  filtered.sort(function(a, b) {
    if (a.dismissed !== b.dismissed) return a.dismissed ? 1 : -1;
    return a.dueDate.localeCompare(b.dueDate);
  });

  if (filtered.length === 0) {
    document.getElementById('reminderList').innerHTML = '<div class="empty-state"><div class="empty-icon">&#128276;</div><p>暂无提醒</p></div>';
    return;
  }

  var html = '<div class="reminder-list">';
  filtered.forEach(function(r) {
    var cls = 'normal';
    if (r.dismissed) cls = 'dismissed';
    else if (r.dueDate < today) cls = 'overdue';
    else if (r.dueDate <= sevenDaysLater) cls = 'urgent';

    html += '<div class="reminder-item ' + cls + '">' +
      '<div class="reminder-info">' +
      '<h4>' + (r.title || '') +
      ' <span class="tag tag-' + (r.type === '缴费提醒' ? 'yellow' : r.type === '续保提醒' ? 'red' : r.type === '保单周年' ? 'blue' : 'gray') +
      '">' + (r.type || '') + '</span>' +
      (r.dismissed ? ' <span class="tag tag-gray">已处理</span>' : '') +
      '</h4>' +
      '<p>到期日期: ' + formatDate(r.dueDate) +
      ' | 提前 ' + (r.daysBefore || 0) + ' 天' +
      ' | 关联: ' + (r.clientName || '-') + ' - ' + (r.policyCode || '-') +
      '</p></div>' +
      '<div class="reminder-actions">';
    if (!r.dismissed) {
      html += '<button class="btn-sm btn-success" onclick="dismissReminder(\'' + r.id + '\')">已处理</button>' +
        '<button class="btn-sm btn-outline" onclick="editReminder(\'' + r.id + '\')">编辑</button>';
    }
    html += '<button class="btn-sm btn-danger" onclick="deleteReminder(\'' + r.id + '\')">删除</button>' +
      '</div></div>';
  });
  html += '</div>';
  document.getElementById('reminderList').innerHTML = html;
}

    showToast('请填写提醒标题和到期日期', 'warning');
    return;

  var editId = document.getElementById('reminderEditId').value;
  var obj = {
    id: editId || genId(),
    type: document.getElementById('reminderType').value,
    policyCode: document.getElementById('reminderPolicy').value,
    clientName: document.getElementById('reminderClient').value,
    title: title,
    dueDate: dueDate,
    daysBefore: parseInt(document.getElementById('reminderDaysBefore').value) || 30,
    enabled: document.getElementById('reminderEnabled').checked,
    dismissed: false,
    createdAt: new Date().toISOString().slice(0, 10).replace(/-/g, '')
  };

  if (editId) {
    var idx = reminderData.findIndex(function(r) { return r.id === editId; });
    if (idx >= 0) {
      obj.dismissed = reminderData[idx].dismissed;
      obj.createdAt = reminderData[idx].createdAt;
      reminderData[idx] = obj;
    }
  } else {
    reminderData.push(obj);

  closeModal('reminderModal');

}
