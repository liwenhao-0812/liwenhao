/* 删除提醒 */
function deleteReminder(id) {
  showConfirm('确定要删除此提醒吗？', function() {
    reminderData = reminderData.filter(function(r) { return r.id !== id; });
    saveReminderData();
    renderReminders();
    showToast('提醒已删除', 'success');
  });
}

/* 批量生成提醒 */
function batchGenerateReminders() {
  if (clientData.length === 0) {
    showToast('暂无客户数据', 'warning');
    return;
  }

  var count = 0;
  clientData.forEach(function(c) {
    (c.policies || []).forEach(function(p) {
      if (p.status !== '有效' || !p.effectiveDate) return;
      var effDate = p.effectiveDate;

      /* 缴费提醒 */
      if (p.paymentMethod === '年缴') {
        /* 每年一个提醒 */
        var nextPayDate = effDate.substr(0, 4) + String(new Date().getFullYear()).padStart(4, '0');
        if (nextPayDate.length < 8) nextPayDate = effDate;
        if (parseInt(nextPayDate) < parseInt(new Date().toISOString().slice(0, 10).replace(/-/g, ''))) {
          var year = parseInt(nextPayDate.substr(0, 4)) + 1;
          nextPayDate = String(year) + effDate.substr(4, 4);
        }
        /* 检查是否已存在 */
        var exists = reminderData.some(function(r) {
          return r.policyCode === p.policyCode && r.type === '缴费提醒' && r.dueDate === nextPayDate && r.clientName === c.name;
        });
        if (!exists) {
          reminderData.push({
            id: genId(),
            type: '缴费提醒',
            policyCode: p.policyCode,
            clientName: c.name,
            title: '缴费提醒 - ' + (p.insuranceName || '') + ' (' + (p.policyCode || '') + ')',
            dueDate: nextPayDate,
            daysBefore: 30,
            enabled: true,
            dismissed: false,
            createdAt: new Date().toISOString().slice(0, 10).replace(/-/g, '')
          });
          count++;
        }
      } else if (p.paymentMethod === '月缴') {
        /* 月缴：每月提醒 */
        var thisMonth = new Date().toISOString().slice(0, 7).replace(/-/g, '');
        var day = effDate.length >= 8 ? effDate.substr(6, 2) : '01';
        var monthDue = thisMonth + day;
        var exists = reminderData.some(function(r) {
          return r.policyCode === p.policyCode && r.type === '缴费提醒' && r.dueDate === monthDue && r.clientName === c.name;
        });
        if (!exists) {
          reminderData.push({
            id: genId(),
            type: '缴费提醒',
            policyCode: p.policyCode,
            clientName: c.name,
            title: '月缴提醒 - ' + (p.insuranceName || '') + ' (' + (p.policyCode || '') + ')',
            dueDate: monthDue,
            daysBefore: 7,
            enabled: true,
            dismissed: false,
            createdAt: new Date().toISOString().slice(0, 10).replace(/-/g, '')
          });
          count++;
        }
      }

      /* 续保提醒 */
      var renewDate = effDate;
      if (renewDate.length === 8) {
        var rYear = parseInt(renewDate.substr(0, 4)) + 1;
        renewDate = String(rYear) + renewDate.substr(4, 4);
      }
      var existsRenew = reminderData.some(function(r) {
        return r.policyCode === p.policyCode && r.type === '续保提醒' && r.dueDate === renewDate && r.clientName === c.name;
      });
      if (!existsRenew) {
        reminderData.push({
          id: genId(),
          type: '续保提醒',
          policyCode: p.policyCode,
          clientName: c.name,
          title: '续保提醒 - ' + (p.insuranceName || '') + ' (' + (p.policyCode || '') + ')',
          dueDate: renewDate,
          daysBefore: 60,
          enabled: true,
          dismissed: false,
          createdAt: new Date().toISOString().slice(0, 10).replace(/-/g, '')
        });
        count++;
      }

      /* 保单周年提醒 */
      var existsAnniv = reminderData.some(function(r) {
        return r.policyCode === p.policyCode && r.type === '保单周年' && r.clientName === c.name;
      });
      if (!existsAnniv) {
        reminderData.push({
          id: genId(),
          type: '保单周年',
          policyCode: p.policyCode,
          clientName: c.name,
          title: '保单周年 - ' + (p.insuranceName || '') + ' (' + (p.policyCode || '') + ')',
          dueDate: effDate,
          daysBefore: 14,
          enabled: true,
          dismissed: false,
          createdAt: new Date().toISOString().slice(0, 10).replace(/-/g, '')
        });
        count++;
      }
    });
  });

  saveReminderData();
  showToast('批量生成完成，共新增 ' + count + ' 条提醒', 'success');
  if (currentTab === 'reminders') renderReminders();
}

    saveReminderData();

function populateTrackClientSelect() {

/* 渲染追踪统计 */
function renderTrackingStats() {
  var totalPolicies = 0, validPolicies = 0, totalContacts = 0, totalPremium = 0;
  clientData.forEach(function(c) {
    totalPolicies += (c.policies || []).length;
    validPolicies += (c.policies || []).filter(function(p) { return p.status === '有效'; }).length;
    totalContacts += (c.contactHistory || []).length;
    (c.policies || []).forEach(function(p) { totalPremium += parseFloat(p.annualPremium) || 0; });
  });
  document.getElementById('trackingStats').innerHTML = '' +
    '<div class="stat-card"><div class="stat-value">' + totalPolicies + '</div><div class="stat-label">总保单数</div></div>' +
    '<div class="stat-card green"><div class="stat-value">' + validPolicies + '</div><div class="stat-label">有效保单</div></div>' +
    '<div class="stat-card yellow"><div class="stat-value">' + totalContacts + '</div><div class="stat-label">联系记录</div></div>' +
    '<div class="stat-card"><div class="stat-value">' + formatMoney(totalPremium) + '</div><div class="stat-label">总年缴保费</div></div>';
}

/* 加载追踪数据 */
function loadTrackingData() {
  var sel = document.getElementById('trackClientSelect');
  var idx = parseInt(sel.value);
  var content = document.getElementById('trackingContent');

  if (isNaN(idx) || !clientData[idx]) {
    content.innerHTML = '<div class="empty-state"><div class="empty-icon">&#128269;</div><p>请选择一个客户查看追踪详情</p></div>';
    return;
  }

  var c = clientData[idx];
  var html = '';

  /* 联系记录时间线 */
  html += '<div class="card"><div class="card-title">联系追踪 - ' + (c.name || '') +
    '<button class="btn-sm btn-primary" onclick="selectedClientIdx=' + idx + ';openAddContactModal()">添加联系记录</button></div>';

  /* 联系频率统计 */
  var contacts = c.contactHistory || [];
  var statusCount = {};
  contacts.forEach(function(ch) {
    statusCount[ch.status] = (statusCount[ch.status] || 0) + 1;
  });
  html += '<div style="margin-bottom:12px;">';
  Object.keys(statusCount).forEach(function(s) {
    html += '<span class="tag tag-blue" style="margin-right:8px;">' + s + ': ' + statusCount[s] + ' 次</span>';
  });
  html += '</div>';

  if (contacts.length === 0) {
    html += '<div class="empty-state"><p>暂无联系记录</p></div>';
  } else {
    html += '<div class="timeline">';
    contacts.forEach(function(ch) {
      var cls = 'success';
      if (ch.status === '未联系上' || ch.status === '电话挂断') cls = 'danger';
      else if (ch.status === '已加微信') cls = 'warning';
      html += '<div class="timeline-item ' + cls + '">' +
        '<div class="timeline-date">' + formatDate(ch.date) +
        ' <span class="tag tag-' +
        (ch.status === '已电话联系' || ch.status === '面见客户' ? 'green' : ch.status === '未联系上' || ch.status === '电话挂断' ? 'red' : 'yellow') +
        '">' + (ch.status || '') + '</span></div>' +
        '<div class="timeline-content">' + (ch.note || '无备注') + '</div></div>';
    });
    html += '</div>';
  }
  html += '</div>';

  /* 保单状态追踪 */
  html += '<div class="card"><div class="card-title">保单状态追踪</div>';
  var validPolicies = (c.policies || []).filter(function(p) { return p.status === '有效'; });
  var expiredPolicies = (c.policies || []).filter(function(p) { return p.status === '失效'; });

  html += '<div style="margin-bottom:12px;">' +
    '<span class="tag tag-green" style="font-size:14px;">有效: ' + validPolicies.length + '</span> ' +
    '<span class="tag tag-red" style="font-size:14px;">失效: ' + expiredPolicies.length + '</span></div>';

  /* 有效保单 */
  if (validPolicies.length > 0) {
    html += '<h4 style="font-size:14px;margin-bottom:8px;color:#166534;">有效保单</h4>';
    validPolicies.forEach(function(p) {
      html += '<div style="padding:8px;border:1px solid #dcfce7;border-radius:8px;margin-bottom:6px;">' +
        '<strong>' + (p.policyCode || '') + '</strong> - ' + (p.insuranceName || '') +
        ' | 保费: ' + formatMoney(p.annualPremium) + ' | 保额: ' + formatMoney(p.sumInsured) +
        ' | 生效日: ' + formatDate(p.effectiveDate) + '</div>';
    });
  }

  /* 失效保单 */
  if (expiredPolicies.length > 0) {
    html += '<h4 style="font-size:14px;margin:12px 0 8px;color:#991b1b;">失效保单</h4>';
    expiredPolicies.forEach(function(p) {
      html += '<div style="padding:8px;border:1px solid #fee2e2;border-radius:8px;margin-bottom:6px;">' +
        '<strong>' + (p.policyCode || '') + '</strong> - ' + (p.insuranceName || '') +
        ' | 生效日: ' + formatDate(p.effectiveDate) + '</div>';
    });
  }

  /* 服务记录 */
  html += '<h4 style="font-size:14px;margin:12px 0 8px;color:#1e40af;">服务记录</h4>';
  var hasService = false;
  (c.policies || []).forEach(function(p) {
    if (p.serviceRecords && p.serviceRecords.length > 0) {
      hasService = true;
      p.serviceRecords.forEach(function(sr) {
        html += '<div class="timeline">' +
          '<div class="timeline-item">' +
          '<div class="timeline-date">' + formatDate(sr.date) + ' | ' + (p.policyCode || '') + ' - ' + (p.insuranceName || '') + '</div>' +
          '<div class="timeline-content">' + (sr.content || '') + '</div></div></div>';
      });
    }
  });
  if (!hasService) html += '<p style="font-size:13px;color:#94a3b8;">暂无服务记录</p>';
  html += '</div>';

  content.innerHTML = html;
}

/* 兼容性JSON导入 - 支持直接数组和包装格式两种 */
function importData(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var raw = JSON.parse(ev.target.result);
      /* 判断数据格式 */
      var arrData = null;
      if (Array.isArray(raw)) {
        /* 格式一：直接是数组 [{name, idCard, ...}, ...] */
        arrData = raw;
      } else if (raw && raw.policies && Array.isArray(raw.policies)) {
        /* 格式二：包装格式 {policies: [...], reminders: [...], ...} */
        arrData = raw.policies;
      }
      if (!arrData || !Array.isArray(arrData) || arrData.length === 0) {
        showToast('未找到有效的客户数据', 'warning');
        return;
      }
      /* 标准化每条记录，确保字段完整 */
      var normalized = arrData.map(function(item) {
        return {
          name: item.name || '',
          idCard: item.idCard || '',
          phone: item.phone || '',
          address: item.address || '',
          workCompany: item.workCompany || '',
          workAddress: item.workAddress || '',
          policies: (item.policies || []).map(function(p) {
            return {
              policyCode: p.policyCode || '',
              insuranceName: p.insuranceName || '',
              codeType: p.codeType || '',
              mainType: p.mainType || '主险',
              parentPolicyCode: p.parentPolicyCode || '',
              status: p.status || '',
              effectiveDate: p.effectiveDate || '',
              paymentMethod: p.paymentMethod || '年缴',
              annualPremium: p.annualPremium || '',
              sumInsured: p.sumInsured || '',
              paymentTerm: p.paymentTerm || '',
              insured: p.insured || '',
              insuredRelation: p.insuredRelation || '',
              insuredId: p.insuredId || '',
              insuredPhone: p.insuredPhone || '',
              beneficiaries: p.beneficiaries || [],
              remark: p.remark || '',
              extraFields: p.extraFields || {},
              serviceRecords: p.serviceRecords || []
            };
          }),
          familyMembers: item.familyMembers || [],
          contactHistory: item.contactHistory || []
        };
      });
      showConfirm('检测到 ' + normalized.length + ' 位客户数据。确定导入将覆盖当前数据。', function() {
        clientData = normalized;
        savePolicyData();
        /* 如果包装格式还有提醒，也导入 */
        if (raw && raw.reminders && Array.isArray(raw.reminders)) {
          reminderData = raw.reminders;
          saveReminderData();
        }
        refreshCurrentTab();
        updateBottomStats();
        autoSyncPush();
        showToast('成功导入 ' + normalized.length + ' 位客户数据', 'success');
      });
    } catch(err) {
      showToast('JSON文件解析失败：' + err.message, 'error');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* Excel批量导入 */
function importExcelData(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var data = new Uint8Array(ev.target.result);
      var workbook = XLSX.read(data, { type: 'array' });
      var sheetName = workbook.SheetNames[0];
      var sheet = workbook.Sheets[sheetName];
      var rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
      if (rows.length === 0) {
        showToast('Excel文件中没有数据行', 'warning');
        return;
      }
      /* 按投保人姓名分组 */
      var clientMap = {};
      rows.forEach(function(row) {
        var name = (row['投保人姓名'] || '').toString().trim();
        if (!name) return;
        if (!clientMap[name]) {
          clientMap[name] = {
            name: name,
            idCard: (row['投保人身份证号'] || '').toString().trim(),
            phone: (row['联系电话'] || '').toString().trim(),
            address: (row['通信地址'] || '').toString().trim(),
            workCompany: (row['工作单位'] || '').toString().trim(),
            workAddress: (row['工作地址'] || '').toString().trim(),
            policies: [],
            familyMembers: [],
            contactHistory: []
          };
        }
        /* 解析受益人 */
        var beneficiaries = [];
        var beneStr = (row['受益人'] || '').toString().trim();
        if (beneStr) {
          var parts = beneStr.split(/[\/、,，]/);
          var quotaEach = Math.round(100 / parts.length);
          parts.forEach(function(part, i) {
            part = part.trim();
            if (part) {
              beneficiaries.push({
                name: part,
                quota: i === parts.length - 1 ? 100 - quotaEach * (parts.length - 1) : quotaEach
              });
            }
          });
        }
        var policy = {
          policyCode: (row['保单代码'] || '').toString().trim(),
          insuranceName: (row['险种名称'] || '').toString().trim(),
          codeType: (row['险种代码'] || '').toString().trim(),
          mainType: (row['主险/附加险'] || '主险').toString().trim(),
          parentPolicyCode: (row['关联主险代码'] || '').toString().trim(),
          status: (row['保单状态'] || '有效').toString().trim(),
          effectiveDate: (row['生效日'] || '').toString().trim().replace(/-/g, ''),
          paymentMethod: (row['缴费方式'] || '年缴').toString().trim(),
          annualPremium: (row['年缴保费（元）'] || '').toString().trim(),
          sumInsured: (row['保额（元）'] || '').toString().trim(),
          paymentTerm: (row['缴费期限（年）'] || '').toString().trim(),
          insured: (row['被保险人'] || '').toString().trim(),
          insuredRelation: (row['与被保人关系'] || '').toString().trim(),
          insuredId: (row['被保人身份证'] || '').toString().trim(),
          insuredPhone: (row['被保人手机号码'] || '').toString().trim(),
          beneficiaries: beneficiaries,
          remark: (row['备注'] || '').toString().trim(),
          extraFields: {},
          serviceRecords: []
        };
        clientMap[name].policies.push(policy);
      });
      var clientList = Object.values(clientMap);
      showConfirm('从Excel解析到 ' + clientList.length + ' 位客户数据。确定导入将覆盖当前数据。', function() {
        clientData = clientList;
        savePolicyData();
        refreshCurrentTab();
        updateBottomStats();
        autoSyncPush();
        showToast('Excel导入成功，共 ' + clientList.length + ' 位客户', 'success');
      });
    } catch(err) {
      showToast('Excel解析失败：' + err.message, 'error');
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
}

    '.tag-invalid { color: #991b1b; }' +

    '</style></head><body>';

  /* 标题 */
  htmlContent += '<h1>保单信息汇总</h1>';

  /* 投保人基本信息 */
  htmlContent += '<h2>一、投保人信息</h2>';
  htmlContent += '<table>';
  htmlContent += '<tr><th style="width:120px;">投保人姓名</th><td>' + (c.name || '-') + '</td></tr>';
  htmlContent += '<tr><th>身份证号</th><td>' + (c.idCard || '-') + '</td></tr>';
  htmlContent += '<tr><th>联系电话</th><td>' + (c.phone || '-') + '</td></tr>';
  htmlContent += '<tr><th>通信地址</th><td>' + (c.address || '-') + '</td></tr>';
  if (c.workCompany) htmlContent += '<tr><th>工作单位</th><td>' + c.workCompany + '</td></tr>';
  if (c.workAddress) htmlContent += '<tr><th>工作地址</th><td>' + c.workAddress + '</td></tr>';
  htmlContent += '</table>';

  /* 家庭成员 */
  var sectionIdx = 1;
  if (c.familyMembers && c.familyMembers.length > 0) {
    sectionIdx++;
    htmlContent += '<h2>二、家庭成员</h2>';
    htmlContent += '<table><tr><th>姓名</th><th>关系</th><th>身份证号</th><th>电话</th><th>备注</th></tr>';

      htmlContent += '<tr><td>' + (fm.name || '') + '</td><td>' + (fm.relationship || '') + '</td><td>' + (fm.idCard || '') + '</td><td>' + (fm.phone || '') + '</td><td>' + (fm.note || '') + '</td></tr>';
    });
    htmlContent += '</table>';
  }

  /* 保单信息 */
  var policies = c.policies || [];
  if (policies.length > 0) {
    sectionIdx++;
    var cnNum = ['一','二','三','四','五'];
    htmlContent += '<h2>' + (cnNum[sectionIdx - 1] || sectionIdx) + '、保单明细</h2>';

    /* 汇总统计 */
    var totalPremium = 0;
    var validCount = 0;
    policies.forEach(function(p) {
      totalPremium += parseFloat(p.annualPremium) || 0;
      if (p.status === '有效') validCount++;
    });
    htmlContent += '<div class="total-box">';
    htmlContent += '<b>保单统计：</b>共 ' + policies.length + ' 份保单，其中有效 ' + validCount + ' 份，失效 ' + (policies.length - validCount) + ' 份；年缴保费合计 ' + totalPremium.toFixed(2) + ' 元';
    htmlContent += '</div>';

    /* 逐份保单详情 */
    policies.forEach(function(p, i) {
      htmlContent += '<h3>保单 ' + (i + 1) + (p.mainType === '附加险' ? '（附加险）' : '') + '</h3>';

      htmlContent += '<tr><th style="width:120px;">保单代码</th><td>' + (p.policyCode || '-') + '</td><th style="width:120px;">险种代码</th><td>' + (p.codeType || '-') + '</td></tr>';

      htmlContent += '<tr><th>年缴保费</th><td><b>' + formatMoney(p.annualPremium) + ' 元</b></td><th>缴费期限</th><td>' + (p.paymentTerm ? p.paymentTerm + ' 年' : '-') + '</td></tr>';
      if (p.sumInsured) {
        htmlContent += '<tr><th>保额</th><td colspan="3"><b>' + formatMoney(p.sumInsured) + ' 元</b></td></tr>';
      }
      htmlContent += '<tr><th>被保险人</th><td>' + (p.insured || '-') + '</td><th>与被保人关系</th><td>' + (p.insuredRelation || '-') + '</td></tr>';

      /* 受益人 */
      if (p.beneficiaries && p.beneficiaries.length > 0) {

        htmlContent += '<tr><th>受益人</th><td colspan="3">' + beneNames + '</td></tr>';
      }
      if (p.remark) {
        htmlContent += '<tr><th>备注</th><td colspan="3">' + p.remark + '</td></tr>';
      }
      htmlContent += '</table>';
    });
  }

  /* 联系记录 */
  if (c.contactHistory && c.contactHistory.length > 0) {
    sectionIdx++;
    var cnNum = ['一','二','三','四','五'];
    htmlContent += '<h2>' + (cnNum[sectionIdx - 1] || sectionIdx) + '、联系记录</h2>';
    htmlContent += '<table><tr><th>日期</th><th>状态</th><th>备注</th></tr>';
    c.contactHistory.forEach(function(ch) {
      htmlContent += '<tr><td>' + formatDate(ch.date) + '</td><td>' + (ch.status || '') + '</td><td>' + (ch.note || '') + '</td></tr>';
    });
    htmlContent += '</table>';
  }

  /* 页脚 */
  htmlContent += '<div class="footer">';
  htmlContent += '此文档由保单管理系统自动生成 | 导出时间：' + new Date().toLocaleString('zh-CN');
  htmlContent += '</div>';
  htmlContent += '</body></html>';

  /* 生成并下载docx文件 */
  var blob = new Blob(['\ufeff' + htmlContent], { type: 'application/msword' });
  var fileName = (c.name || '客户') + '_保单信息.doc';
  saveAs(blob, fileName);
  showToast('Word文档已导出：' + fileName, 'success');
}

/* 修改密码 */
function changePassword() {
  var oldPwd = document.getElementById('oldPwd').value;
  var newPwd = document.getElementById('newPwd').value;
  if (!oldPwd || !newPwd) {
    showToast('请填写当前密码和新密码', 'warning');
    return;
  }
  if (newPwd.length < 6) {
    showToast('新密码长度至少6位', 'warning');
    return;
  }
  var users = getUsers();
  var user = users.find(function(u) { return u.username === currentUser; });
  if (!user) { showToast('用户不存在', 'error'); return; }
  if (user.passwordHash !== simpleHash(oldPwd)) {
    showToast('当前密码错误', 'error');
    return;
  }
  user.passwordHash = simpleHash(newPwd);
  saveUsers(users);
  document.getElementById('oldPwd').value = '';
  document.getElementById('newPwd').value = '';
  showToast('密码修改成功', 'success');
}

/* 初始化管理员账号 */
function initAdmin() {
  var users = getUsers();
  var admin = users.find(function(u) { return u.username === 'admin'; });
  if (!admin) {
    users.push({
      username: 'admin',
      passwordHash: simpleHash('admin888'),
      createdAt: new Date().toISOString(),
      lastLogin: null
    });
    saveUsers(users);
  }
}

/* 检查登录状态 */
function checkLogin() {
  var saved = localStorage.getItem('pms_currentUser');
  if (saved) {
    var users = getUsers();
    if (users.find(function(u) { return u.username === saved; })) {
      currentUser = saved;
      enterMainApp();
      return;
    }
  }
  document.getElementById('authPage').style.display = 'flex';
}

});
