/* 批量计算 */
function batchCalculate() {
  var ruleId = document.getElementById('batchCalcRule').value;
  var rule = pricingRules.find(function(r) { return r.id === ruleId; });
  if (!rule) { showToast('请选择定价规则', 'warning'); return; }

  var checks = document.querySelectorAll('.batch-policy-check:checked');
  if (checks.length === 0) { showToast('请选择要计算的保单', 'warning'); return; }

  var results = [];
  checks.forEach(function(chk) {
    var parts = chk.value.split('-');
    var cIdx = parseInt(parts[0]);
    var pIdx = parseInt(parts[1]);
    var c = clientData[cIdx];
    var p = c.policies[pIdx];
    if (!p) return;

    /* 从身份证推算年龄（简易） */
    var age = 30;
    if (p.insuredId && p.insuredId.length >= 14) {
      var birthYear = p.insuredId.substr(6, 4);
      age = new Date().getFullYear() - parseInt(birthYear);
    }
    var sumInsured = parseFloat(p.sumInsured) || 0;
    var payTerm = parseFloat(p.paymentTerm) || 0;
    var gender = '男';
    if (p.insuredId && p.insuredId.length >= 17) {
      var genderCode = parseInt(p.insuredId.charAt(16));
      gender = genderCode % 2 === 0 ? '女' : '男';
    }

    /* 检查条件 */
    var matched = true;
    (rule.conditions || []).forEach(function(cond) {
      var actualVal;
      switch(cond.field) {
        case 'age': actualVal = age; break;
        case 'gender': actualVal = gender; break;
        case 'sumInsured': actualVal = sumInsured; break;
        case 'paymentTerm': actualVal = payTerm; break;
        default: actualVal = 0;
      }
      var condVal = parseFloat(cond.value) || cond.value;
      switch(cond.operator) {
        case 'gt': if (!(actualVal > condVal)) matched = false; break;
        case 'lt': if (!(actualVal < condVal)) matched = false; break;
        case 'eq': if (!(actualVal == condVal)) matched = false; break;
        case 'gte': if (!(actualVal >= condVal)) matched = false; break;
        case 'lte': if (!(actualVal <= condVal)) matched = false; break;
        case 'in': if (String(condVal).split(',').indexOf(String(actualVal)) < 0) matched = false; break;
      }
    });

    var premium = 0;
    var calc = rule.calculation || {};
    if (matched) {
      try {
        if (calc.type === 'fixed') {
          premium = parseFloat(calc.base) || 0;
        } else if (calc.type === 'percentage') {
          premium = (parseFloat(calc.base) || 0) + sumInsured * (parseFloat(calc.rate) || 0) / 100;
        } else if (calc.type === 'formula') {
          var expr = (calc.formula || '')
            .replace(/base/g, parseFloat(calc.base) || 0)
            .replace(/age/g, age)
            .replace(/sumInsured/g, sumInsured)
            .replace(/paymentTerm/g, payTerm)
            .replace(/gender/g, gender === '男' ? 1 : 0);
          premium = eval(expr);
        }
        premium = Math.max(0, premium);
      } catch(e) { premium = -1; }
    }

    results.push({
      client: c.name, policy: p.policyCode, insurance: p.insuranceName,
      matched: matched, premium: premium, currentPremium: parseFloat(p.annualPremium) || 0
    });
  });

  /* 渲染结果表 */
  var html = '<table class="policy-table" style="margin-top:16px;"><thead><tr>' +
    '<th>客户</th><th>保单</th><th>险种</th><th>匹配</th><th>计算保费</th><th>当前保费</th><th>差额</th></tr></thead><tbody>';
  results.forEach(function(r) {
    var diff = r.premium >= 0 ? r.premium - r.currentPremium : NaN;
    html += '<tr>' +
      '<td>' + r.client + '</td>' +
      '<td>' + r.policy + '</td>' +
      '<td>' + r.insurance + '</td>' +
      '<td>' + (r.matched ? '<span class="tag tag-green">匹配</span>' : '<span class="tag tag-red">不匹配</span>') + '</td>' +
      '<td>' + (r.premium >= 0 ? formatMoney(r.premium) : '计算失败') + '</td>' +
      '<td>' + formatMoney(r.currentPremium) + '</td>' +
      '<td style="color:' + (diff > 0 ? '#ef4444' : diff < 0 ? '#22c55e' : '#64748b') + ';">' +
        (r.premium >= 0 ? (diff > 0 ? '+' : '') + formatMoney(diff) : '-') + '</td></tr>';
  });
  html += '</tbody></table>';

}

/* 兼容性JSON导入 - 支持直接数组和包装格式两种 */
function importData(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var raw = JSON.parse(ev.target.result);
      /* 判断数据格式 */
      var arrData = null;
      if (Array.isArray(raw)) {
        /* 格式一：直接是数组 [{name, idCard, ...}, ...] */
        arrData = raw;
      } else if (raw && raw.policies && Array.isArray(raw.policies)) {
        /* 格式二：包装格式 {policies: [...], reminders: [...], ...} */
        arrData = raw.policies;
      }
      if (!arrData || !Array.isArray(arrData) || arrData.length === 0) {
        showToast('未找到有效的客户数据', 'warning');
        return;
      }
      /* 标准化每条记录，确保字段完整 */
      var normalized = arrData.map(function(item) {
        return {
          name: item.name || '',
          idCard: item.idCard || '',
          phone: item.phone || '',
          address: item.address || '',
          workCompany: item.workCompany || '',
          workAddress: item.workAddress || '',
          policies: (item.policies || []).map(function(p) {
            return {
              policyCode: p.policyCode || '',
              insuranceName: p.insuranceName || '',
              codeType: p.codeType || '',
              mainType: p.mainType || '主险',
              parentPolicyCode: p.parentPolicyCode || '',
              status: p.status || '',
              effectiveDate: p.effectiveDate || '',
              paymentMethod: p.paymentMethod || '年缴',
              annualPremium: p.annualPremium || '',
              sumInsured: p.sumInsured || '',
              paymentTerm: p.paymentTerm || '',
              insured: p.insured || '',
              insuredRelation: p.insuredRelation || '',
              insuredId: p.insuredId || '',
              insuredPhone: p.insuredPhone || '',
              beneficiaries: p.beneficiaries || [],
              remark: p.remark || '',
              extraFields: p.extraFields || {},
              serviceRecords: p.serviceRecords || []
            };
          }),
          familyMembers: item.familyMembers || [],
          contactHistory: item.contactHistory || []
        };
      });
      showConfirm('检测到 ' + normalized.length + ' 位客户数据。确定导入将覆盖当前数据。', function() {
        clientData = normalized;
        savePolicyData();
        /* 如果包装格式还有提醒和定价规则，也导入 */
        if (raw && raw.reminders && Array.isArray(raw.reminders)) {
          reminderData = raw.reminders;
          saveReminderData();
        }
        if (raw && raw.pricingRules && Array.isArray(raw.pricingRules)) {
          pricingRules = raw.pricingRules;
          savePricingRules();
        }
        refreshCurrentTab();
        updateBottomStats();
        autoSyncPush();
        showToast('成功导入 ' + normalized.length + ' 位客户数据', 'success');
      });
    } catch(err) {
      showToast('JSON文件解析失败：' + err.message, 'error');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* Excel批量导入 */
function importExcelData(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var data = new Uint8Array(ev.target.result);
      var workbook = XLSX.read(data, { type: 'array' });
      var sheetName = workbook.SheetNames[0];
      var sheet = workbook.Sheets[sheetName];
      var rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
      if (rows.length === 0) {
        showToast('Excel文件中没有数据行', 'warning');
        return;
      }
      /* 按投保人姓名分组 */
      var clientMap = {};
      rows.forEach(function(row) {
        var name = (row['投保人姓名'] || '').toString().trim();
        if (!name) return;
        if (!clientMap[name]) {
          clientMap[name] = {
            name: name,
            idCard: (row['投保人身份证号'] || '').toString().trim(),
            phone: (row['联系电话'] || '').toString().trim(),
            address: (row['通信地址'] || '').toString().trim(),
            workCompany: (row['工作单位'] || '').toString().trim(),
            workAddress: (row['工作地址'] || '').toString().trim(),
            policies: [],
            familyMembers: [],
            contactHistory: []
          };
        }
        /* 解析受益人 */
        var beneficiaries = [];
        var beneStr = (row['受益人'] || '').toString().trim();
        if (beneStr) {
          var parts = beneStr.split(/[\/、,，]/);
          var quotaEach = Math.round(100 / parts.length);
          parts.forEach(function(part, i) {
            part = part.trim();
            if (part) {
              beneficiaries.push({
                name: part,
                quota: i === parts.length - 1 ? 100 - quotaEach * (parts.length - 1) : quotaEach
              });
            }
          });
        }
        var policy = {
          policyCode: (row['保单代码'] || '').toString().trim(),
          insuranceName: (row['险种名称'] || '').toString().trim(),
          codeType: (row['险种代码'] || '').toString().trim(),
          mainType: (row['主险/附加险'] || '主险').toString().trim(),
          parentPolicyCode: (row['关联主险代码'] || '').toString().trim(),
          status: (row['保单状态'] || '有效').toString().trim(),
          effectiveDate: (row['生效日'] || '').toString().trim().replace(/-/g, ''),
          paymentMethod: (row['缴费方式'] || '年缴').toString().trim(),
          annualPremium: (row['年缴保费（元）'] || '').toString().trim(),
          sumInsured: (row['保额（元）'] || '').toString().trim(),
          paymentTerm: (row['缴费期限（年）'] || '').toString().trim(),
          insured: (row['被保险人'] || '').toString().trim(),
          insuredRelation: (row['与被保人关系'] || '').toString().trim(),
          insuredId: (row['被保人身份证'] || '').toString().trim(),
          insuredPhone: (row['被保人手机号码'] || '').toString().trim(),
          beneficiaries: beneficiaries,
          remark: (row['备注'] || '').toString().trim(),
          extraFields: {},
          serviceRecords: []
        };
        clientMap[name].policies.push(policy);
      });
      var clientList = Object.values(clientMap);
      showConfirm('从Excel解析到 ' + clientList.length + ' 位客户数据。确定导入将覆盖当前数据。', function() {
        clientData = clientList;
        savePolicyData();
        refreshCurrentTab();
        updateBottomStats();
        autoSyncPush();
        showToast('Excel导入成功，共 ' + clientList.length + ' 位客户', 'success');
      });
    } catch(err) {
      showToast('Excel解析失败：' + err.message, 'error');
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
}

/* 修改密码 */
function changePassword() {
  var oldPwd = document.getElementById('oldPwd').value;
  var newPwd = document.getElementById('newPwd').value;
  if (!oldPwd || !newPwd) {
    showToast('请填写当前密码和新密码', 'warning');
    return;
  }
  if (newPwd.length < 6) {
    showToast('新密码长度至少6位', 'warning');
    return;
  }
  var users = getUsers();
  var user = users.find(function(u) { return u.username === currentUser; });
  if (!user) { showToast('用户不存在', 'error'); return; }
  if (user.passwordHash !== simpleHash(oldPwd)) {
    showToast('当前密码错误', 'error');
    return;
  }
  user.passwordHash = simpleHash(newPwd);
  saveUsers(users);
  document.getElementById('oldPwd').value = '';
  document.getElementById('newPwd').value = '';
  showToast('密码修改成功', 'success');
}

function checkLogin() {
  var saved = localStorage.getItem('pms_currentUser');
  if (saved) {
    var users = getUsers();
    if (users.find(function(u) { return u.username === saved; })) {
      currentUser = saved;
      enterMainApp();
      return;

  }
  document.getElementById('authPage').style.display = 'flex';
}
